<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Interstellar"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#000000"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Interstellar Journey</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;inset:0}
    canvas{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}
    #statusMask{position:fixed;top:0;left:0;right:0;height:max(54px,env(safe-area-inset-top,54px));background:linear-gradient(to bottom,rgba(0,0,8,1) 0%,rgba(0,0,8,.85) 55%,transparent 100%);z-index:100;pointer-events:none}
    #ui{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#030810 0%,#000 70%);transition:opacity 1.5s ease}
    #ui.gone{opacity:0;pointer-events:none}
    .title{font-size:clamp(1.2rem,4.5vw,2.6rem);font-weight:100;letter-spacing:.55em;color:#7aabdd;text-transform:uppercase;margin-bottom:6px;text-align:center}
    .subtitle{font-size:.6rem;color:#1a2a3a;letter-spacing:.4em;margin-bottom:12px;text-align:center;text-transform:uppercase}
    #pwaHint{font-size:.52rem;color:#0d1825;letter-spacing:.16em;margin-bottom:44px;text-align:center;text-transform:uppercase;max-width:260px;line-height:1.9}
    #startBtn{width:130px;height:130px;border-radius:50%;border:1px solid #1a3050;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#4a7aaa;font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;position:relative;-webkit-appearance:none}
    #startBtn::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid #0a1525;animation:pr 3s ease-out infinite}
    #startBtn::before{content:'';position:absolute;inset:-22px;border-radius:50%;border:1px solid #050c18;animation:pr 3s ease-out infinite .8s}
    @keyframes pr{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
    #startBtn svg{width:30px;height:30px;fill:#4a7aaa;stroke:none}
    #startBtn:active{border-color:#4a7aaa;background:rgba(74,122,170,.08)}
    #loadWrap{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:32px}
    #loadWrap.show{display:flex}
    #loadBar{width:220px;height:1px;background:#0a1020;position:relative}
    #loadFill{position:absolute;top:0;left:0;height:100%;background:#4a7aaa;width:0%;transition:width .3s}
    #loadTxt{font-size:.62rem;color:#2a3a4a;letter-spacing:.15em}
    #hud{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:16px;background:rgba(0,5,15,.8);border:1px solid #0a1a2a;border-radius:50px;padding:10px 24px;opacity:0;pointer-events:none;transition:opacity .6s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
    #hud.visible{opacity:1;pointer-events:all}
    #hud button{background:none;border:none;color:#4a7aaa;font-size:1.2rem;cursor:pointer;padding:4px 8px;min-width:44px;min-height:44px;-webkit-appearance:none}
    #tname{font-size:.68rem;color:#1a2a3a;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #hint{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));left:50%;transform:translateX(-50%);z-index:28;font-size:.56rem;color:#0d1a26;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity 1s;pointer-events:none;white-space:nowrap}
    #hint.show{opacity:1}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="statusMask"></div>

<div id="ui">
  <div class="title">Interstellar</div>
  <div class="subtitle">Journey Through Space</div>
  <div id="pwaHint"></div>
  <button id="startBtn">
    <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    Iniciar
  </button>
  <div id="loadWrap">
    <div id="loadBar"><div id="loadFill"></div></div>
    <div id="loadTxt"></div>
  </div>
</div>

<div id="hud">
  <button id="pauseBtn">⏸</button>
  <span id="tname">Interstellar</span>
  <button id="stopBtn">⏹</button>
</div>
<div id="hint">toca para controles · arrastra para girar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (!window.matchMedia('(display-mode: fullscreen)').matches && !navigator.standalone)
  document.getElementById('pwaHint').textContent = '⋮ → Añadir a pantalla de inicio para pantalla completa';

// ══════════════════════════════════════════════
// RENDERER
// ══════════════════════════════════════════════
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x00000a);
const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x00000a, 50, 180);
const camera = new THREE.PerspectiveCamera(85, innerWidth/innerHeight, 0.01, 400);

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 350));

// ══════════════════════════════════════════════
// STAR STREAKS — the warp effect (DO NOT TOUCH)
// ══════════════════════════════════════════════
const STREAK_COUNT = 3500;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(STREAK_COUNT * 6);
const sCol = new Float32Array(STREAK_COUNT * 6);
for (let i = 0; i < STREAK_COUNT; i++) placeStreak(i, 0, 0, 0);
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sGeo.setAttribute('color',    new THREE.BufferAttribute(sCol, 3));
const streaks = new THREE.LineSegments(sGeo, new THREE.LineBasicMaterial({
  vertexColors:true, transparent:true, opacity:.95,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
scene.add(streaks);

function placeStreak(i, cx, cy, camZ) {
  const b=i*6, angle=Math.random()*Math.PI*2;
  const rnd=Math.random(), radius=3+rnd*rnd*20;
  const z=camZ-10-Math.random()*150;
  const x=cx+Math.cos(angle)*radius, y=cy+Math.sin(angle)*radius;
  sPos[b]=x; sPos[b+1]=y; sPos[b+2]=z-.3;
  sPos[b+3]=x; sPos[b+4]=y; sPos[b+5]=z;
  colorStreak(b, 0, 0);
}
function colorStreak(b, sMid, hi) {
  const warm=Math.random()<.12, bright=.5+Math.random()*.5;
  if (warm) { sCol[b]=bright;sCol[b+1]=bright*.6;sCol[b+2]=bright*.1;sCol[b+3]=1;sCol[b+4]=.85;sCol[b+5]=.35; }
  else { const rb=.55+sMid*.3,gb=.78+hi*.2;sCol[b]=bright*rb;sCol[b+1]=bright*gb;sCol[b+2]=bright;sCol[b+3]=rb;sCol[b+4]=gb;sCol[b+5]=1; }
}

// ── Background dots ─────────────────────────────────────
const BG = 2000;
const bgGeo=new THREE.BufferGeometry();
const bgPos=new Float32Array(BG*3), bgCol=new Float32Array(BG*3);
for (let i=0;i<BG;i++) {
  const a=Math.random()*Math.PI*2, r=1+Math.random()*22;
  bgPos[i*3]=Math.cos(a)*r; bgPos[i*3+1]=Math.sin(a)*r; bgPos[i*3+2]=-Math.random()*160;
  const b=.3+Math.random()*.7; bgCol[i*3]=b*.6; bgCol[i*3+1]=b*.75; bgCol[i*3+2]=b;
}
bgGeo.setAttribute('position',new THREE.BufferAttribute(bgPos,3));
bgGeo.setAttribute('color',   new THREE.BufferAttribute(bgCol,3));
const bgMat=new THREE.PointsMaterial({size:.06,vertexColors:true,transparent:true,opacity:.7,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(bgGeo,bgMat));

// ── Nebula ──────────────────────────────────────────────
const NEB=800;
const nGeo=new THREE.BufferGeometry();
const nPos=new Float32Array(NEB*3), nCol=new Float32Array(NEB*3);
const nebPal=[[.15,.35,.9],[.45,.1,.75],[.1,.55,.5],[.65,.12,.22],[.05,.22,.72]];
for (let i=0;i<NEB;i++) {
  const a=Math.random()*Math.PI*2, r=2+Math.random()*18;
  nPos[i*3]=Math.cos(a)*r; nPos[i*3+1]=Math.sin(a)*r; nPos[i*3+2]=-Math.random()*150;
  const c=nebPal[i%nebPal.length]; nCol[i*3]=c[0]; nCol[i*3+1]=c[1]; nCol[i*3+2]=c[2];
}
nGeo.setAttribute('position',new THREE.BufferAttribute(nPos,3));
nGeo.setAttribute('color',   new THREE.BufferAttribute(nCol,3));
const nMat=new THREE.PointsMaterial({size:3.5,vertexColors:true,transparent:true,opacity:.045,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(nGeo,nMat));

// ── Tunnel rings ────────────────────────────────────────
const rings=[];
for (let i=0;i<22;i++) spawnRing(-i*12-5);
function spawnRing(z) {
  const segs=100, geo=new THREE.BufferGeometry();
  const pos=new Float32Array(segs*6);
  for (let i=0;i<segs;i++) {
    const a1=(i/segs)*Math.PI*2, a2=((i+1)/segs)*Math.PI*2, R=16;
    pos[i*6]=Math.cos(a1)*R;pos[i*6+1]=Math.sin(a1)*R;pos[i*6+2]=0;
    pos[i*6+3]=Math.cos(a2)*R;pos[i*6+4]=Math.sin(a2)*R;pos[i*6+5]=0;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(Math.random(),.9,.6),transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false});
  const ring=new THREE.LineSegments(geo,mat);
  ring.position.z=z; scene.add(ring); rings.push(ring);
}

// ══════════════════════════════════════════════
// GALACTIC CLOUD ORBS — additive, self-contained
// Pure CSS-canvas overlay approach to avoid GPU conflict
// ══════════════════════════════════════════════
// Each orb: a 2D canvas texture rendered as a sprite in 3D space
// Sprites are always camera-facing, no geometry to update per frame
const ORBS = 10;
const orbSprites = [];
const orbData    = [];
const orbColors  = [
  {r:0.4,g:0.6,b:1.0}, // blue
  {r:0.7,g:0.2,b:1.0}, // violet
  {r:0.1,g:0.9,b:0.7}, // teal
  {r:1.0,g:0.6,b:0.1}, // amber
  {r:1.0,g:0.2,b:0.5}, // rose
  {r:0.2,g:0.5,b:1.0}, // cobalt
];

function makeOrbTexture(col) {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx2 = size/2;
  // Radial gradient: bright center, transparent edge
  const g = ctx.createRadialGradient(cx2,cx2,0, cx2,cx2,cx2);
  g.addColorStop(0,   `rgba(${Math.round(col.r*255)},${Math.round(col.g*255)},${Math.round(col.b*255)},1)`);
  g.addColorStop(0.3, `rgba(${Math.round(col.r*200)},${Math.round(col.g*200)},${Math.round(col.b*255)},0.6)`);
  g.addColorStop(0.7, `rgba(${Math.round(col.r*100)},${Math.round(col.g*100)},${Math.round(col.b*200)},0.2)`);
  g.addColorStop(1,   `rgba(0,0,0,0)`);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}

for (let i = 0; i < ORBS; i++) {
  const col = orbColors[i % orbColors.length];
  const tex = makeOrbTexture(col);
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sprite = new THREE.Sprite(mat);
  const scale  = 8 + Math.random() * 10;
  sprite.scale.set(scale, scale, 1);

  const angle  = Math.random()*Math.PI*2;
  const offset = 2 + Math.random()*6;
  sprite.position.set(
    Math.cos(angle)*offset,
    Math.sin(angle)*offset,
    -(40 + i*30 + Math.random()*20)
  );

  scene.add(sprite);
  orbSprites.push(sprite);
  orbData.push({ col, scale, radius: scale*0.5 });
}

// ══════════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════════
const AUDIO_URL = 'https://raw.githubusercontent.com/PyCHile/Music_pulse/main/music.mp3';
let actx=null, analyser=null, freq=null, audioSrcNode=null;
let playing=false, paused=false;

const audioEl = new Audio();
audioEl.crossOrigin='anonymous'; audioEl.preload='none'; audioEl.src=AUDIO_URL;

const loadWrap=document.getElementById('loadWrap');
const loadFill=document.getElementById('loadFill');
const loadTxt =document.getElementById('loadTxt');
function setLoad(p,t){loadFill.style.width=p+'%';loadTxt.textContent=t;}

document.getElementById('startBtn').addEventListener('click', async function(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(req) req.call(el).catch(()=>{});
  this.style.display='none';
  loadWrap.classList.add('show');
  setLoad(3,'Iniciando…');
  if (!actx) {
    try { actx=new(window.AudioContext||window.webkitAudioContext)(); await actx.resume(); }
    catch(e){setLoad(0,'Error: '+e.message);return;}
  }
  if (!audioSrcNode) {
    try {
      analyser=actx.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=.82;
      freq=new Uint8Array(analyser.frequencyBinCount);
      audioSrcNode=actx.createMediaElementSource(audioEl);
      audioSrcNode.connect(analyser); analyser.connect(actx.destination);
    } catch(e){setLoad(0,'Error audio: '+e.message);return;}
  }
  setLoad(10,'Conectando…');
  audioEl.addEventListener('progress', onProgress);
  audioEl.addEventListener('canplay',  onCanPlay, {once:true});
  audioEl.load();
  try { await audioEl.play(); playing=true; paused=false; }
  catch(e) { audioEl.addEventListener('canplay',async()=>{try{await audioEl.play();playing=true;paused=false;}catch(e2){}},{once:true}); }
});

function onProgress() {
  try { if(audioEl.buffered.length>0&&audioEl.duration){const p=Math.min(98,(audioEl.buffered.end(0)/audioEl.duration)*100);setLoad(p,`Cargando ${Math.round(p)}%`);} } catch(_){}
}
function onCanPlay() {
  setLoad(100,'');
  audioEl.removeEventListener('progress',onProgress);
  document.getElementById('ui').classList.add('gone');
  showHudBriefly();
  setTimeout(()=>document.getElementById('hint').classList.add('show'),3500);
}
audioEl.addEventListener('pause', ()=>{if(!paused)playing=false;});
audioEl.addEventListener('play',  ()=>{playing=true;});
audioEl.addEventListener('ended', ()=>{playing=false;});

let hudTimer=null;
function showHudBriefly(){
  const hud=document.getElementById('hud');
  hud.classList.add('visible');
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>{hud.classList.remove('visible');document.getElementById('hint').classList.add('show');},3500);
}

document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(audioEl.paused){actx.resume().then(()=>audioEl.play());document.getElementById('pauseBtn').textContent='⏸';playing=true;paused=false;}
  else{audioEl.pause();paused=true;playing=false;document.getElementById('pauseBtn').textContent='▶';}
});
document.getElementById('stopBtn').addEventListener('click',()=>{
  audioEl.pause();audioEl.currentTime=0;playing=false;paused=false;
  document.getElementById('hud').classList.remove('visible');
  document.getElementById('hint').classList.remove('show');
  document.getElementById('ui').classList.remove('gone');
  document.getElementById('startBtn').style.display='';
  loadWrap.classList.remove('show');
  const exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(exit)exit.call(document).catch(()=>{});
});

// ── Touch ───────────────────────────────────────────────
let touching=false,isDragging=false,holdT=null,lx=0,ly=0;
document.addEventListener('touchstart',e=>{
  if(!document.getElementById('ui').classList.contains('gone'))return;
  touching=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;isDragging=false;
  holdT=setTimeout(()=>isDragging=true,120);
  showHudBriefly();document.getElementById('hint').classList.remove('show');
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!touching)return;
  const dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;
  if(Math.abs(dx)>6||Math.abs(dy)>6)isDragging=true;
  if(isDragging){targetYaw+=dx*.003;targetPitch+=dy*.002;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
},{passive:true});
document.addEventListener('touchend',()=>{touching=false;clearTimeout(holdT);},{passive:true});
document.addEventListener('mousemove',e=>{targetYaw=(e.clientX/innerWidth-.5)*.45;targetPitch=(e.clientY/innerHeight-.5)*.22;});

// ══════════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════════
let t=0,camYaw=0,camPitch=0,targetYaw=0,targetPitch=0;
let sBass=0,sMid=0,sHi=0;
let inTurn=false,turnTarget=0,currentTurn=0,turnCooldown=0;
let ringColorTimer=0;
const MAX_YAW=.38, MAX_PITCH=.20;
let prevTime=performance.now();

function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(), dt=Math.min((now-prevTime)/1000,.05);
  prevTime=now; t+=dt;

  // ── Audio ────────────────────────────────────────
  let bass=0,mid=0,hi=0;
  if(analyser&&playing){
    analyser.getByteFrequencyData(freq);
    const L=freq.length;
    for(let i=0;i<L*.05;i++) bass+=freq[i]; bass/=(L*.05*255);
    for(let i=L*.05|0;i<L*.25;i++) mid+=freq[i];  mid/=(L*.20*255);
    for(let i=L*.25|0;i<L*.70;i++) hi+=freq[i];   hi/=(L*.45*255);
  }
  sBass+=(bass-sBass)*.12; sMid+=(mid-sMid)*.08; sHi+=(hi-sHi)*.06;
  const energy=sBass*.55+sMid*.3+sHi*.15;

  const warpSpeed=(6+sBass*38+sMid*12)*dt;

  // ── Beat-driven turns ────────────────────────────
  turnCooldown=Math.max(0,turnCooldown-dt);
  if(playing&&bass>.55&&sBass>.4&&turnCooldown<=0&&!inTurn){
    turnTarget=(Math.random()-.5)*.3;
    inTurn=true; currentTurn=0; turnCooldown=3.5+Math.random()*3;
  }
  if(inTurn){
    const rem=turnTarget-currentTurn, step=rem*Math.min(1,dt*2.5);
    targetYaw+=step; currentTurn+=step;
    if(Math.abs(rem)<.002) inTurn=false;
  }
  targetYaw  =Math.max(-MAX_YAW,  Math.min(MAX_YAW,  targetYaw));
  targetPitch=Math.max(-MAX_PITCH,Math.min(MAX_PITCH,targetPitch));
  camYaw  +=(targetYaw  -camYaw)  *2.2*dt;
  camPitch+=(targetPitch-camPitch)*2.2*dt;

  camera.rotation.order='YXZ';
  camera.rotation.y=camYaw  +Math.sin(t*.2)*.012;
  camera.rotation.x=camPitch+Math.sin(t*.15)*.008;
  camera.rotation.z=Math.sin(t*.1)*.01+sBass*.015;

  const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  camera.position.addScaledVector(dir,warpSpeed);
  const cr=Math.sqrt(camera.position.x**2+camera.position.y**2);
  if(cr>6){camera.position.x*=6/cr;camera.position.y*=6/cr;}

  const camZ=camera.position.z, cx=camera.position.x, cy=camera.position.y;
  const streakLen=.4+warpSpeed*7+sBass*3;

  // ── Streaks ──────────────────────────────────────
  const posA=sGeo.attributes.position, colA=sGeo.attributes.color;
  for(let i=0;i<STREAK_COUNT;i++){
    const b=i*6;
    if(posA.array[b+5]>camZ+1){placeStreak(i,cx,cy,camZ);colorStreak(b,sMid,sHi);}
    else posA.array[b+2]=posA.array[b+5]-streakLen;
    colA.array[b]*=.35;colA.array[b+1]*=.35;colA.array[b+2]*=.35;
  }
  posA.needsUpdate=true; colA.needsUpdate=true;

  // ── Background dots ──────────────────────────────
  const bpa=bgGeo.attributes.position;
  for(let i=0;i<BG;i++){
    if(bpa.array[i*3+2]>camZ+4){
      const a=Math.random()*Math.PI*2,r=1+Math.random()*20;
      bpa.array[i*3]=cx+Math.cos(a)*r;bpa.array[i*3+1]=cy+Math.sin(a)*r;bpa.array[i*3+2]=camZ-15-Math.random()*150;
    }
  }
  bpa.needsUpdate=true; bgMat.opacity=.45+sMid*.35;

  // ── Nebula ───────────────────────────────────────
  const npa=nGeo.attributes.position;
  for(let i=0;i<NEB;i++){
    if(npa.array[i*3+2]>camZ+10){
      const a=Math.random()*Math.PI*2,r=2+Math.random()*18;
      npa.array[i*3]=cx+Math.cos(a)*r;npa.array[i*3+1]=cy+Math.sin(a)*r;npa.array[i*3+2]=camZ-15-Math.random()*140;
    }
  }
  npa.needsUpdate=true;
  nMat.opacity=.025+sMid*.08+sHi*.06; nMat.size=3+energy*4.5;

  // ── Rings ────────────────────────────────────────
  for(const r of rings){
    r.position.z+=warpSpeed*2.8;
    const rs=1+sBass*.22;r.scale.set(rs,rs,1);
    r.material.opacity=.08+sMid*.28;
    r.rotation.z+=dt*.15;
    if(r.position.z>camZ+6){r.position.z=camZ-240-Math.random()*20;r.material.color.setHSL(Math.random(),.88,.5+energy*.22);}
  }
  ringColorTimer+=dt;
  if(sBass>.6&&ringColorTimer>.3){ringColorTimer=0;for(const r of rings)r.material.color.setHSL(Math.random(),1,.72);}

  // ── Galactic orbs (sprites) ──────────────────────
  for(let i=0;i<ORBS;i++){
    const sp=orbSprites[i], od=orbData[i];
    sp.position.z+=warpSpeed*2.8;

    const dz=sp.position.z-camZ;
    const R=od.radius;

    // Fade: appears 4R ahead, peaks at 1R, gone when behind
    let fade=0;
    if(dz<0&&dz>-R*4)  fade=1-Math.abs(dz)/(R*4);
    else if(dz>=0&&dz<R) fade=1-dz/R;

    sp.material.opacity=Math.min(0.7, fade*(0.4+sBass*.35+sMid*.15));

    // Scale pulse on bass
    const ps=od.scale*(1+sBass*.15);
    sp.scale.set(ps,ps,1);

    // Respawn ahead
    if(sp.position.z>camZ+R+4){
      const ang=Math.random()*Math.PI*2, off=2+Math.random()*7;
      sp.position.set(cx+Math.cos(ang)*off, cy+Math.sin(ang)*off, camZ-260-Math.random()*80);
      // New color
      const nc=orbColors[Math.floor(Math.random()*orbColors.length)];
      od.col=nc;
      // Rebuild texture
      sp.material.map=makeOrbTexture(nc);
      sp.material.needsUpdate=true;
    }
  }

  // ── Global ───────────────────────────────────────
  camera.fov=Math.max(72,Math.min(110,85+warpSpeed+sBass*7));
  camera.updateProjectionMatrix();
  scene.fog.near=35+energy*18; scene.fog.far=140+energy*70;

  renderer.render(scene,camera);
}
loop();
</script>
