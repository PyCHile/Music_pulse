le';s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.appendChild(s)});try{await load(`./runtime/journey/AIStatusOverlayBootstrapV52.js?v=${v}`)}catch(e){boot.overlayError=String(e)}try{await load(`./runtime/main.js?v=${v}`);if(boot.interactionReady){enter.disabled=false;enter.textContent='Entrar'}else{const until=performance.now()+5000;while(!boot.interactionReady&&performance.now()<until)await new Promise(r=>setTimeout(r,25));if(boot.interactionReady){enter.disabled=false;enter.textContent='Entrar'}else throw new Error('interaction_not_ready')}}catch(e){boot.runtimeError=String(e);enter.disabled=true;enter.textContent='No disponible';document.getElementById('status').textContent='Error de runtime'}</script></body></html>
