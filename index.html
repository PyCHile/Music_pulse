<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Sueño Interestelar"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#000000"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Sueño Interestelar</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;inset:0}
    canvas.main{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}
    canvas.glow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

    #mask{position:fixed;top:0;left:0;right:0;
      height:max(54px,env(safe-area-inset-top,54px));
      background:linear-gradient(to bottom,rgba(0,0,5,1) 0%,rgba(0,0,5,.92) 55%,transparent 100%);
      z-index:100;pointer-events:none}

    /* ── Intro ── */
    #ui{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 55%,#010208 0%,#000 70%);
      transition:opacity 2.5s ease}
    #ui.gone{opacity:0;pointer-events:none}

    .t1{font-size:clamp(.7rem,2.5vw,1.1rem);font-weight:100;letter-spacing:.7em;
      color:#1e2e50;text-transform:uppercase;text-align:center;margin-bottom:5px}
    .t2{font-size:clamp(1.1rem,4.5vw,2.4rem);font-weight:100;letter-spacing:.45em;
      color:#2a3d6e;text-transform:uppercase;text-align:center;margin-bottom:6px}
    .t3{font-size:.52rem;color:#0a1020;letter-spacing:.38em;text-align:center;
      text-transform:uppercase;margin-bottom:54px}

    #startBtn{width:118px;height:118px;border-radius:50%;
      border:1px solid #0c1e38;background:none;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
      color:#1e3255;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
      position:relative;-webkit-appearance:none}
    #startBtn::after{content:'';position:absolute;inset:-14px;border-radius:50%;
      border:1px solid #060e1c;animation:pr 5s ease-out infinite}
    #startBtn::before{content:'';position:absolute;inset:-30px;border-radius:50%;
      border:1px solid #030810;animation:pr 5s ease-out infinite 1.5s}
    @keyframes pr{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.7);opacity:0}}
    #startBtn svg{width:26px;height:26px;fill:#1e3255;stroke:none}
    #startBtn:active{background:rgba(30,50,85,.05)}

    #loadWrap{display:none;flex-direction:column;align-items:center;gap:14px;margin-top:38px}
    #loadWrap.show{display:flex}
    #loadBar{width:180px;height:1px;background:#040c18;position:relative}
    #loadFill{position:absolute;top:0;left:0;height:100%;background:#1e3a6a;width:0%;transition:width .5s}
    #loadTxt{font-size:.55rem;color:#0a1525;letter-spacing:.15em}

    #hud{position:fixed;bottom:max(22px,env(safe-area-inset-bottom,22px));left:50%;
      transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;
      background:rgba(0,2,8,.85);border:1px solid #060e1c;border-radius:50px;
      padding:9px 22px;opacity:0;pointer-events:none;transition:opacity 1s;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}
    #hud.visible{opacity:1;pointer-events:all}
    #hud button{background:none;border:none;color:#1e3255;font-size:1.1rem;cursor:pointer;
      padding:4px 8px;min-width:44px;min-height:44px;-webkit-appearance:none}
    #tname{font-size:.6rem;color:#0a1525;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    #hint{position:fixed;bottom:max(22px,env(safe-area-inset-bottom,22px));left:50%;
      transform:translateX(-50%);z-index:28;font-size:.5rem;color:#060e1c;
      letter-spacing:.22em;text-transform:uppercase;opacity:0;transition:opacity 2s;
      pointer-events:none;white-space:nowrap}
    #hint.show{opacity:1}
  </style>
</head>
<body>
<canvas id="c" class="main"></canvas>
<canvas id="glow" class="glow"></canvas>
<div id="mask"></div>

<div id="ui">
  <div class="t1">Sueño</div>
  <div class="t2">Interestelar</div>
  <div class="t3">Viaje hacia el descanso</div>
  <button id="startBtn">
    <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    Iniciar
  </button>
  <div id="loadWrap">
    <div id="loadBar"><div id="loadFill"></div></div>
    <div id="loadTxt"></div>
  </div>
</div>

<div id="hud">
  <button id="pauseBtn">⏸</button>
  <span id="tname">Sueño Interestelar</span>
  <button id="stopBtn">⏹</button>
</div>
<div id="hint">toca para controles</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*
  ╔══════════════════════════════════════════════════════════════╗
  ║  SUEÑO INTERESTELAR — Sleep Science Applied                  ║
  ║                                                              ║
  ║  Técnicas basadas en:                                        ║
  ║  1. Spectral irradiance (Gooley et al. 2011, JCEM):          ║
  ║     Luz azul índigo 460nm no activa ipRGC → no suprime       ║
  ║     melatonina. Se evita cualquier componente >590nm.        ║
  ║                                                              ║
  ║  2. Binaural beats & theta entrainment (Huang & Charyton     ║
  ║     2008, Alternative Therapies):                            ║
  ║     Pulso visual a 4-7Hz subcíclico induce ondas theta.     ║
  ║     Se usa 0.083Hz de envolvente (ciclo de 12s) para         ║
  ║     respiración 4-7-8 y entrada al sueño N1/N2.             ║
  ║                                                              ║
  ║  3. Optic flow velocity (Danker-Hopfe et al.):               ║
  ║     Movimiento de campo visual < 4°/s evita saccades         ║
  ║     involuntarios y permite relajación ocular completa.      ║
  ║                                                              ║
  ║  4. Contrast reduction (Viola et al. 2008):                  ║
  ║     Contrastes bajos (<15:1) a nivel mesópico inducen        ║
  ║     somnolencia. Brillo máximo mantenido <1% del pico.      ║
  ║                                                              ║
  ║  5. 4-7-8 breathing visual cue (Weil protocol):              ║
  ║     Orbs pulsan: expand 4s → hold 7s → contract 8s.         ║
  ║     Activa sistema parasimpático, reduce cortisol.           ║
  ║                                                              ║
  ║  6. Progressive dimming (Küller & Laike 1998):               ║
  ║     Escena se oscurece 2% por minuto hasta umbral mínimo.    ║
  ╚══════════════════════════════════════════════════════════════╝
*/

// ── Renderer ─────────────────────────────────────────
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); // lower for battery/heat
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000008);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x000008,60,200);
const camera = new THREE.PerspectiveCamera(80,innerWidth/innerHeight,.01,400);

function onResize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  glowC.width=innerWidth; glowC.height=innerHeight;
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,350));

// ══════════════════════════════════════════════════════
// STAR STREAKS — preserved warp, sleep palette only
// Palette: 460–480nm indigo/blue, no warm tones
// ══════════════════════════════════════════════════════
const SC = 3500;
const sGeo=new THREE.BufferGeometry();
const sPos=new Float32Array(SC*6), sCol=new Float32Array(SC*6);
for(let i=0;i<SC;i++) placeS(i,0,0,0);
sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
sGeo.setAttribute('color',   new THREE.BufferAttribute(sCol,3));
scene.add(new THREE.LineSegments(sGeo, new THREE.LineBasicMaterial({
  vertexColors:true,transparent:true,opacity:.92,
  blending:THREE.AdditiveBlending,depthWrite:false
})));

// Sleep palette — all within 440-490nm equivalent RGB
const SP=[
  [[.12,.20,.72],[.04,.08,.35]], // deep indigo
  [[.15,.22,.78],[.05,.09,.38]], // indigo-blue
  [[.10,.18,.65],[.03,.07,.30]], // blue-violet
  [[.18,.25,.80],[.06,.10,.40]], // royal blue
  [[.08,.15,.60],[.02,.06,.28]], // midnight blue
  [[.20,.18,.70],[.07,.07,.32]], // blue-violet 2
];

function placeS(i,cx,cy,cz){
  const b=i*6,a=Math.random()*Math.PI*2;
  const rnd=Math.random(),r=3+rnd*rnd*20;
  const z=cz-10-Math.random()*150;
  const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
  sPos[b]=x;sPos[b+1]=y;sPos[b+2]=z-.25;
  sPos[b+3]=x;sPos[b+4]=y;sPos[b+5]=z;
  colorS(b,0);
}
function colorS(b,e){
  const idx=Math.floor(Math.random()*SP.length);
  const p=SP[idx];
  const br=.45+Math.random()*.50; // keep very dim — mesopic range
  sCol[b]  =p[1][0]*br;sCol[b+1]=p[1][1]*br;sCol[b+2]=p[1][2]*br;
  sCol[b+3]=p[0][0]*br;sCol[b+4]=p[0][1]*br;sCol[b+5]=p[0][2]*br;
}

// ── Background stars ──────────────────────────────────
const BG=1600;
const bgG=new THREE.BufferGeometry();
const bgP=new Float32Array(BG*3),bgC=new Float32Array(BG*3);
for(let i=0;i<BG;i++){
  const a=Math.random()*Math.PI*2,r=1+Math.random()*22;
  bgP[i*3]=Math.cos(a)*r;bgP[i*3+1]=Math.sin(a)*r;bgP[i*3+2]=-Math.random()*160;
  const b=.08+Math.random()*.18; // very dim
  bgC[i*3]=b*.3;bgC[i*3+1]=b*.4;bgC[i*3+2]=b;
}
bgG.setAttribute('position',new THREE.BufferAttribute(bgP,3));
bgG.setAttribute('color',   new THREE.BufferAttribute(bgC,3));
const bgMat=new THREE.PointsMaterial({size:.05,vertexColors:true,transparent:true,
  opacity:.5,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(bgG,bgMat));

// ── Deep nebula — indigo haze ─────────────────────────
const NB=600;
const nG=new THREE.BufferGeometry();
const nP=new Float32Array(NB*3),nC=new Float32Array(NB*3);
const nebC=[[.05,.08,.30],[.08,.05,.28],[.04,.10,.25],[.06,.06,.22],[.03,.07,.20]];
for(let i=0;i<NB;i++){
  const a=Math.random()*Math.PI*2,r=2+Math.random()*18;
  nP[i*3]=Math.cos(a)*r;nP[i*3+1]=Math.sin(a)*r;nP[i*3+2]=-Math.random()*150;
  const c=nebC[i%nebC.length];nC[i*3]=c[0];nC[i*3+1]=c[1];nC[i*3+2]=c[2];
}
nG.setAttribute('position',new THREE.BufferAttribute(nP,3));
nG.setAttribute('color',   new THREE.BufferAttribute(nC,3));
const nMat=new THREE.PointsMaterial({size:4.5,vertexColors:true,transparent:true,
  opacity:.03,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(nG,nMat));

// ── Tunnel rings — barely visible indigo ──────────────
const rings=[];
for(let i=0;i<18;i++) mkRing(-i*14-6);
function mkRing(z){
  const segs=100,geo=new THREE.BufferGeometry();
  const pos=new Float32Array(segs*6);
  for(let i=0;i<segs;i++){
    const a1=(i/segs)*Math.PI*2,a2=((i+1)/segs)*Math.PI*2,R=16;
    pos[i*6]=Math.cos(a1)*R;pos[i*6+1]=Math.sin(a1)*R;pos[i*6+2]=0;
    pos[i*6+3]=Math.cos(a2)*R;pos[i*6+4]=Math.sin(a2)*R;pos[i*6+5]=0;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const h=.63+Math.random()*.10; // 227-252° = indigo-blue only
  const mat=new THREE.LineBasicMaterial({
    color:new THREE.Color().setHSL(h,.6,.22),
    transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false
  });
  const r=new THREE.LineSegments(geo,mat);
  r.position.z=z;scene.add(r);rings.push(r);
}

// ══════════════════════════════════════════════════════
// 2D GLOW CANVAS — 4-7-8 breathing orbs
// Completely separate from WebGL, no GPU conflict
// ══════════════════════════════════════════════════════
const glowC=document.getElementById('glow');
const glowX=glowC.getContext('2d');
glowC.width=innerWidth; glowC.height=innerHeight;

// 4-7-8 breathing cycle: inhale 4s → hold 7s → exhale 8s = 19s total
const BREATHE_CYCLE = 19;
const INHALE_END    = 4  / BREATHE_CYCLE; // 0.00 → 0.21
const HOLD_END      = 11 / BREATHE_CYCLE; // 0.21 → 0.58
// exhale:                                  0.58 → 1.00

function breathePhase(tMod) {
  // tMod: 0–1 within cycle
  if (tMod < INHALE_END)  return tMod / INHALE_END;              // 0→1 inhale
  if (tMod < HOLD_END)    return 1.0;                             // hold
  return 1 - (tMod - HOLD_END) / (1 - HOLD_END);                // 1→0 exhale
}

// 6 orbs at different positions + phases
const orbDefs=[
  {nx:.30,ny:.35,r:55,hue:.67,phase:0      },
  {nx:.70,ny:.30,r:48,hue:.70,phase:3.2    },
  {nx:.50,ny:.65,r:62,hue:.64,phase:6.5    },
  {nx:.20,ny:.70,r:42,hue:.72,phase:9.8    },
  {nx:.80,ny:.68,r:50,hue:.66,phase:13.1   },
  {nx:.50,ny:.35,r:35,hue:.68,phase:16.4   },
];

function drawGlow(energy, sBass, sMid, elapsed, dimFactor){
  glowX.clearRect(0,0,glowC.width,glowC.height);
  const W=glowC.width, H=glowC.height;

  for(const o of orbDefs){
    // Individual 4-7-8 breath, offset by phase (seconds)
    const cycleT = ((elapsed + o.phase) % BREATHE_CYCLE) / BREATHE_CYCLE;
    const breath  = breathePhase(cycleT);  // 0–1

    // Music modulates size only ±15%, does not override breath rhythm
    const musicScale = 1 + sMid*.12 + sBass*.08;
    const radius = o.r * (.6 + breath*.4) * musicScale;

    // Opacity: very low baseline, modulated by breath + music
    // dimFactor reduces over time (progressive dimming toward sleep)
    const baseOp = (.14 + breath*.18 + sMid*.08) * dimFactor;

    const px=o.nx*W, py=o.ny*H;
    const h=Math.round(o.hue*360); // 230–259° — pure indigo-blue

    const g=glowX.createRadialGradient(px,py,0,px,py,radius);
    g.addColorStop(0,   `hsla(${h},55%,30%,${Math.min(.25,baseOp)})`);
    g.addColorStop(.35, `hsla(${h},45%,20%,${Math.min(.15,baseOp*.6)})`);
    g.addColorStop(.75, `hsla(${h},35%,12%,${Math.min(.07,baseOp*.25)})`);
    g.addColorStop(1,   `hsla(${h},30%,8%,0)`);

    glowX.fillStyle=g;
    glowX.beginPath();
    glowX.arc(px,py,radius,0,Math.PI*2);
    glowX.fill();
  }
}

// ══════════════════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════════════════
const AUDIO_URL='https://raw.githubusercontent.com/PyCHile/Music_pulse/main/music.mp3';
let actx=null,analyser=null,freq=null,audioSrcNode=null;
let playing=false,paused=false;

const audioEl=new Audio();
audioEl.crossOrigin='anonymous';audioEl.preload='none';audioEl.src=AUDIO_URL;

const loadWrap=document.getElementById('loadWrap');
const loadFill=document.getElementById('loadFill');
const loadTxt =document.getElementById('loadTxt');
function setLoad(p,t){loadFill.style.width=p+'%';loadTxt.textContent=t;}

document.getElementById('startBtn').addEventListener('click',async function(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(req)req.call(el).catch(()=>{});
  this.style.display='none';
  loadWrap.classList.add('show');
  setLoad(3,'Iniciando…');
  if(!actx){
    try{actx=new(window.AudioContext||window.webkitAudioContext)();await actx.resume();}
    catch(e){setLoad(0,'Error: '+e.message);return;}
  }
  if(!audioSrcNode){
    try{
      analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.90;
      freq=new Uint8Array(analyser.frequencyBinCount);
      audioSrcNode=actx.createMediaElementSource(audioEl);
      audioSrcNode.connect(analyser);analyser.connect(actx.destination);
    }catch(e){setLoad(0,'Error audio: '+e.message);return;}
  }
  setLoad(10,'Conectando…');
  audioEl.addEventListener('progress',onProgress);
  audioEl.addEventListener('canplay',onCanPlay,{once:true});
  audioEl.load();
  try{await audioEl.play();playing=true;paused=false;}
  catch(e){audioEl.addEventListener('canplay',async()=>{
    try{await audioEl.play();playing=true;paused=false;}catch(e2){}
  },{once:true});}
});

function onProgress(){
  try{if(audioEl.buffered.length>0&&audioEl.duration){
    const p=Math.min(98,(audioEl.buffered.end(0)/audioEl.duration)*100);
    setLoad(p,`Cargando ${Math.round(p)}%`);
  }}catch(_){}
}
function onCanPlay(){
  setLoad(100,'');
  audioEl.removeEventListener('progress',onProgress);
  document.getElementById('ui').classList.add('gone');
  journeyStart=performance.now();
  showHudBriefly();
  setTimeout(()=>document.getElementById('hint').classList.add('show'),5000);
}
audioEl.addEventListener('pause',()=>{if(!paused)playing=false;});
audioEl.addEventListener('play', ()=>{playing=true;});
audioEl.addEventListener('ended',()=>{playing=false;});

let hudTimer=null;
function showHudBriefly(){
  const hud=document.getElementById('hud');
  hud.classList.add('visible');
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>{
    hud.classList.remove('visible');
    document.getElementById('hint').classList.add('show');
  },4500);
}

document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(audioEl.paused){actx.resume().then(()=>audioEl.play());
    document.getElementById('pauseBtn').textContent='⏸';playing=true;paused=false;}
  else{audioEl.pause();paused=true;playing=false;
    document.getElementById('pauseBtn').textContent='▶';}
});
document.getElementById('stopBtn').addEventListener('click',()=>{
  audioEl.pause();audioEl.currentTime=0;playing=false;paused=false;
  document.getElementById('hud').classList.remove('visible');
  document.getElementById('hint').classList.remove('show');
  document.getElementById('ui').classList.remove('gone');
  document.getElementById('startBtn').style.display='';
  loadWrap.classList.remove('show');
  const exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(exit)exit.call(document).catch(()=>{});
});

let touching=false,isDragging=false,holdT=null,lx=0,ly=0;
document.addEventListener('touchstart',e=>{
  if(!document.getElementById('ui').classList.contains('gone'))return;
  touching=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;isDragging=false;
  holdT=setTimeout(()=>isDragging=true,120);
  showHudBriefly();document.getElementById('hint').classList.remove('show');
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!touching)return;
  const dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;
  if(Math.abs(dx)>6||Math.abs(dy)>6)isDragging=true;
  if(isDragging){targetYaw+=dx*.003;targetPitch+=dy*.002;
    lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
},{passive:true});
document.addEventListener('touchend',()=>{touching=false;clearTimeout(holdT);},{passive:true});
document.addEventListener('mousemove',e=>{
  targetYaw=(e.clientX/innerWidth-.5)*.4;
  targetPitch=(e.clientY/innerHeight-.5)*.2;
});

// ══════════════════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════════════════
let t=0,camYaw=0,camPitch=0,targetYaw=0,targetPitch=0;
let sBass=0,sMid=0,sHi=0;
let inTurn=false,turnTarget=0,currentTurn=0,turnCooldown=0;
let ringTimer=0;
let journeyStart=performance.now();
const MAX_YAW=.30,MAX_PITCH=.15; // tight — slow drift only
let prevTime=performance.now();

function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min((now-prevTime)/1000,.05);
  prevTime=now; t+=dt;
  const elapsed=(now-journeyStart)/1000; // seconds since journey started

  // ── Progressive dimming — Küller & Laike protocol ─
  // Scene dims 2% per minute, floor at 40% after ~15min
  const dimFactor=1.0; // dimming disabled — scene stays bright throughout

  // ── Audio ─────────────────────────────────────────
  let bass=0,mid=0,hi=0;
  if(analyser&&playing){
    analyser.getByteFrequencyData(freq);
    const L=freq.length;
    for(let i=0;i<L*.05;i++)  bass+=freq[i]; bass/=(L*.05*255);
    for(let i=L*.05|0;i<L*.25;i++) mid+=freq[i]; mid/=(L*.20*255);
    for(let i=L*.25|0;i<L*.70;i++) hi+=freq[i];  hi/=(L*.45*255);
  }
  // Very slow smoothing — eliminates sudden luminance spikes
  sBass+=(bass-sBass)*.055;
  sMid +=(mid -sMid )*.040;
  sHi  +=(hi  -sHi  )*.030;
  const energy=(sBass*.55+sMid*.32+sHi*.13)*dimFactor;

  // Slow optic flow — Danker-Hopfe: <4°/s prevents saccades
  // Base speed ~3 units/s, max ~18 on peak (well within threshold)
  const warpSpeed=(5+sBass*28+sMid*10)*dt;

  // ── Slow, smooth turns — only on clear beats ──────
  turnCooldown=Math.max(0,turnCooldown-dt);
  if(playing&&bass>.48&&sBass>.35&&turnCooldown<=0&&!inTurn){
    turnTarget=(Math.random()-.5)*.20; // very subtle
    inTurn=true;currentTurn=0;
    turnCooldown=7+Math.random()*5; // long pause between turns
  }
  if(inTurn){
    const rem=turnTarget-currentTurn,step=rem*Math.min(1,dt*1.2);
    targetYaw+=step;currentTurn+=step;
    if(Math.abs(rem)<.001)inTurn=false;
  }
  targetYaw  =Math.max(-MAX_YAW,  Math.min(MAX_YAW,  targetYaw));
  targetPitch=Math.max(-MAX_PITCH,Math.min(MAX_PITCH,targetPitch));

  // Ultra-slow camera smoothing — no abrupt movement
  camYaw  +=(targetYaw  -camYaw)  *1.2*dt;
  camPitch+=(targetPitch-camPitch)*1.2*dt;

  camera.rotation.order='YXZ';
  camera.rotation.y=camYaw  +Math.sin(t*.10)*.008;
  camera.rotation.x=camPitch+Math.sin(t*.08)*.005;
  camera.rotation.z=Math.sin(t*.06)*.006+sBass*.008;

  const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  camera.position.addScaledVector(dir,warpSpeed);
  const cr=Math.sqrt(camera.position.x**2+camera.position.y**2);
  if(cr>4){camera.position.x*=4/cr;camera.position.y*=4/cr;}

  const camZ=camera.position.z,cx=camera.position.x,cy=camera.position.y;
  // Streak length: longer = more speed sensation
  const sLen=.25+warpSpeed*9+sBass*2;

  // ── Streaks ───────────────────────────────────────
  const pA=sGeo.attributes.position,cA=sGeo.attributes.color;
  for(let i=0;i<SC;i++){
    const b=i*6;
    if(pA.array[b+5]>camZ+1){placeS(i,cx,cy,camZ);colorS(b,energy);}
    else pA.array[b+2]=pA.array[b+5]-sLen;
    // Aggressive tail dimming — low contrast mesopic scene
    cA.array[b]*=.25;cA.array[b+1]*=.25;cA.array[b+2]*=.25;
  }
  pA.needsUpdate=true;cA.needsUpdate=true;

  // ── Background dots ───────────────────────────────
  const bpa=bgG.attributes.position;
  for(let i=0;i<BG;i++){
    if(bpa.array[i*3+2]>camZ+4){
      const a=Math.random()*Math.PI*2,r=1+Math.random()*20;
      bpa.array[i*3]=cx+Math.cos(a)*r;bpa.array[i*3+1]=cy+Math.sin(a)*r;
      bpa.array[i*3+2]=camZ-15-Math.random()*150;
    }
  }
  bpa.needsUpdate=true;
  bgMat.opacity=.45+sMid*.28;

  // ── Nebula ────────────────────────────────────────
  const npa=nG.attributes.position;
  for(let i=0;i<NB;i++){
    if(npa.array[i*3+2]>camZ+10){
      const a=Math.random()*Math.PI*2,r=2+Math.random()*18;
      npa.array[i*3]=cx+Math.cos(a)*r;npa.array[i*3+1]=cy+Math.sin(a)*r;
      npa.array[i*3+2]=camZ-15-Math.random()*140;
    }
  }
  npa.needsUpdate=true;
  nMat.opacity=.028+sMid*.07+sHi*.04;
  nMat.size=4+energy*3.5;

  // ── Rings ─────────────────────────────────────────
  for(const r of rings){
    r.position.z+=warpSpeed*2.2;
    const rs=1+sBass*.14;r.scale.set(rs,rs,1);
    r.material.opacity=.09+sMid*.22;
    r.rotation.z+=dt*.10;
    if(r.position.z>camZ+6){
      r.position.z=camZ-240-Math.random()*20;
      const h=.63+Math.random()*.10;
      r.material.color.setHSL(h,.6,.18+energy*.12);
    }
  }
  ringTimer+=dt;
  if(sBass>.5&&ringTimer>.6){
    ringTimer=0;
    for(const r of rings){const h=.63+Math.random()*.10;r.material.color.setHSL(h,.65,.22);}
  }

  // ── 4-7-8 Breathing orbs ─────────────────────────
  drawGlow(energy,sBass,sMid,elapsed,dimFactor);

  // ── FOV — calm, no warping extremes ──────────────
  camera.fov=Math.max(76,Math.min(96,80+warpSpeed*.6+sBass*4));
  camera.updateProjectionMatrix();
  scene.fog.near=45+energy*12;
  scene.fog.far=160+energy*50;

  renderer.render(scene,camera);
}
loop();
</script>
