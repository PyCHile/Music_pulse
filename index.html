<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Interstellar"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#000000"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Interstellar Journey</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;inset:0}
    canvas{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}

    /* Status bar mask */
    #mask{position:fixed;top:0;left:0;right:0;height:max(54px,env(safe-area-inset-top,54px));
      background:linear-gradient(to bottom,rgba(0,0,6,1) 0%,rgba(0,0,6,.9) 50%,transparent 100%);
      z-index:100;pointer-events:none}

    #ui{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
      justify-content:center;background:radial-gradient(ellipse at center,#010308 0%,#000 70%);
      transition:opacity 2s ease}
    #ui.gone{opacity:0;pointer-events:none}

    .title{font-size:clamp(1rem,4vw,2.2rem);font-weight:100;letter-spacing:.6em;
      color:#3a5a8a;text-transform:uppercase;margin-bottom:8px;text-align:center}
    .sub{font-size:.55rem;color:#0d1a2a;letter-spacing:.4em;margin-bottom:50px;text-align:center;text-transform:uppercase}

    #startBtn{width:120px;height:120px;border-radius:50%;border:1px solid #0d2040;
      background:none;cursor:pointer;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:6px;
      color:#2a4a6a;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
      position:relative;-webkit-appearance:none}
    #startBtn::after{content:'';position:absolute;inset:-12px;border-radius:50%;
      border:1px solid #050f20;animation:pr 4s ease-out infinite}
    #startBtn::before{content:'';position:absolute;inset:-26px;border-radius:50%;
      border:1px solid #030810;animation:pr 4s ease-out infinite 1.2s}
    @keyframes pr{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.6);opacity:0}}
    #startBtn svg{width:28px;height:28px;fill:#2a4a6a;stroke:none}
    #startBtn:active{background:rgba(42,74,106,.06)}

    #loadWrap{display:none;flex-direction:column;align-items:center;gap:14px;margin-top:36px}
    #loadWrap.show{display:flex}
    #loadBar{width:200px;height:1px;background:#05101a;position:relative}
    #loadFill{position:absolute;top:0;left:0;height:100%;background:#2a4a7a;width:0%;transition:width .4s}
    #loadTxt{font-size:.58rem;color:#0d1a2a;letter-spacing:.15em}

    #hud{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));left:50%;
      transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:16px;
      background:rgba(0,3,10,.8);border:1px solid #050f1a;border-radius:50px;
      padding:10px 24px;opacity:0;pointer-events:none;transition:opacity .8s;
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
    #hud.visible{opacity:1;pointer-events:all}
    #hud button{background:none;border:none;color:#2a4a6a;font-size:1.2rem;cursor:pointer;
      padding:4px 8px;min-width:44px;min-height:44px;-webkit-appearance:none}
    #tname{font-size:.65rem;color:#0d1a2a;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    #hint{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));left:50%;
      transform:translateX(-50%);z-index:28;font-size:.52rem;color:#050f1a;
      letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity 1.5s;
      pointer-events:none;white-space:nowrap}
    #hint.show{opacity:1}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mask"></div>

<div id="ui">
  <div class="title">Interstellar</div>
  <div class="sub">Journey Through Space</div>
  <button id="startBtn">
    <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    Iniciar
  </button>
  <div id="loadWrap">
    <div id="loadBar"><div id="loadFill"></div></div>
    <div id="loadTxt"></div>
  </div>
</div>

<div id="hud">
  <button id="pauseBtn">⏸</button>
  <span id="tname">Interstellar</span>
  <button id="stopBtn">⏹</button>
</div>
<div id="hint">toca para controles</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ══════════════════════════════════════════════════════
// SLEEP SCIENCE COLOR PALETTE
// Research: blue/indigo 460-470nm suppresses cortisol,
// deep violet promotes melatonin. Avoid bright white/yellow.
// Pulse rhythm ~0.1Hz (6 cycles/min) entrains theta waves.
// ══════════════════════════════════════════════════════
const SLEEP_PALETTE = [
  // Streak colors: cool blue spectrum only — no stimulating warm tones
  { head: [0.25, 0.45, 0.90], tail: [0.10, 0.20, 0.55] }, // indigo-blue
  { head: [0.30, 0.35, 0.85], tail: [0.10, 0.15, 0.50] }, // deep blue
  { head: [0.40, 0.30, 0.80], tail: [0.15, 0.10, 0.45] }, // blue-violet
  { head: [0.20, 0.40, 0.75], tail: [0.08, 0.18, 0.42] }, // ocean blue
  { head: [0.50, 0.25, 0.75], tail: [0.20, 0.08, 0.42] }, // violet
  // Rare warm: very dim amber (distant stars), not stimulating at low opacity
  { head: [0.55, 0.42, 0.25], tail: [0.25, 0.18, 0.08] }, // amber dim
];

// ── Renderer ──────────────────────────────────────────
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x00000a);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x00000a,55,185);
const camera = new THREE.PerspectiveCamera(85,innerWidth/innerHeight,.01,400);

function onResize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,350));

// ══════════════════════════════════════════════════════
// STAR STREAKS — warp effect, sleep palette
// ══════════════════════════════════════════════════════
const STREAK_COUNT = 3500;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(STREAK_COUNT*6);
const sCol = new Float32Array(STREAK_COUNT*6);
for(let i=0;i<STREAK_COUNT;i++) placeStreak(i,0,0,0);
sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
sGeo.setAttribute('color',   new THREE.BufferAttribute(sCol,3));
const streaks = new THREE.LineSegments(sGeo, new THREE.LineBasicMaterial({
  vertexColors:true,transparent:true,opacity:.88,
  blending:THREE.AdditiveBlending,depthWrite:false
}));
scene.add(streaks);

function placeStreak(i,cx,cy,camZ){
  const b=i*6,angle=Math.random()*Math.PI*2;
  const rnd=Math.random(),radius=3+rnd*rnd*20;
  const z=camZ-10-Math.random()*150;
  const x=cx+Math.cos(angle)*radius, y=cy+Math.sin(angle)*radius;
  sPos[b]=x;sPos[b+1]=y;sPos[b+2]=z-.3;
  sPos[b+3]=x;sPos[b+4]=y;sPos[b+5]=z;
  setSleepColor(b);
}

function setSleepColor(b, energy){
  // Pick from sleep palette — rare warm (~8%)
  const warmChance = energy ? energy*0.05 : 0;
  const idx = Math.random()<(0.08+warmChance)
    ? 5
    : Math.floor(Math.random()*5);
  const p = SLEEP_PALETTE[idx];
  const bright = 0.35+Math.random()*0.45; // keep dim overall
  sCol[b]  =p.tail[0]*bright; sCol[b+1]=p.tail[1]*bright; sCol[b+2]=p.tail[2]*bright;
  sCol[b+3]=p.head[0]*bright; sCol[b+4]=p.head[1]*bright; sCol[b+5]=p.head[2]*bright;
}

// ── Background dot stars — deep blue only ─────────────
const BG = 1800;
const bgGeo=new THREE.BufferGeometry();
const bgPos=new Float32Array(BG*3),bgCol=new Float32Array(BG*3);
for(let i=0;i<BG;i++){
  const a=Math.random()*Math.PI*2,r=1+Math.random()*22;
  bgPos[i*3]=Math.cos(a)*r;bgPos[i*3+1]=Math.sin(a)*r;bgPos[i*3+2]=-Math.random()*160;
  // Cool blue-indigo only
  const b=.15+Math.random()*.3;
  bgCol[i*3]=b*.4;bgCol[i*3+1]=b*.55;bgCol[i*3+2]=b;
}
bgGeo.setAttribute('position',new THREE.BufferAttribute(bgPos,3));
bgGeo.setAttribute('color',   new THREE.BufferAttribute(bgCol,3));
const bgMat=new THREE.PointsMaterial({size:.055,vertexColors:true,transparent:true,opacity:.6,
  sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(bgGeo,bgMat));

// ── Deep nebula haze — violet/indigo ──────────────────
const NEB=700;
const nGeo=new THREE.BufferGeometry();
const nPos=new Float32Array(NEB*3),nCol=new Float32Array(NEB*3);
// Sleep-safe nebula colors: deep indigo, violet, blue-black
const nebPal=[
  [.08,.12,.45],[.12,.08,.40],[.06,.18,.38],
  [.15,.08,.42],[.05,.10,.35],
];
for(let i=0;i<NEB;i++){
  const a=Math.random()*Math.PI*2,r=2+Math.random()*18;
  nPos[i*3]=Math.cos(a)*r;nPos[i*3+1]=Math.sin(a)*r;nPos[i*3+2]=-Math.random()*150;
  const c=nebPal[i%nebPal.length];
  nCol[i*3]=c[0];nCol[i*3+1]=c[1];nCol[i*3+2]=c[2];
}
nGeo.setAttribute('position',new THREE.BufferAttribute(nPos,3));
nGeo.setAttribute('color',   new THREE.BufferAttribute(nCol,3));
const nMat=new THREE.PointsMaterial({size:4,vertexColors:true,transparent:true,opacity:.035,
  sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(nGeo,nMat));

// ── Tunnel rings — subtle indigo ──────────────────────
const rings=[];
for(let i=0;i<20;i++) spawnRing(-i*13-5);
function spawnRing(z){
  const segs=100,geo=new THREE.BufferGeometry();
  const pos=new Float32Array(segs*6);
  for(let i=0;i<segs;i++){
    const a1=(i/segs)*Math.PI*2,a2=((i+1)/segs)*Math.PI*2,R=16;
    pos[i*6]=Math.cos(a1)*R;pos[i*6+1]=Math.sin(a1)*R;pos[i*6+2]=0;
    pos[i*6+3]=Math.cos(a2)*R;pos[i*6+4]=Math.sin(a2)*R;pos[i*6+5]=0;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  // Only indigo/violet hues for rings
  const hue=.62+Math.random()*.12; // 0.62–0.74 = blue-violet range
  const mat=new THREE.LineBasicMaterial({
    color:new THREE.Color().setHSL(hue,.7,.35),
    transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false
  });
  const ring=new THREE.LineSegments(geo,mat);
  ring.position.z=z;scene.add(ring);rings.push(ring);
}

// ══════════════════════════════════════════════════════
// SLEEP GLOW ORBS — pure canvas overlay (NO Three.js geometry)
// Rendered directly on a 2D canvas layered over the WebGL canvas
// Zero impact on render loop
// ══════════════════════════════════════════════════════
const glowCanvas = document.createElement('canvas');
glowCanvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5';
document.body.appendChild(glowCanvas);
const glowCtx = glowCanvas.getContext('2d');

function resizeGlow(){glowCanvas.width=innerWidth;glowCanvas.height=innerHeight;}
resizeGlow();
window.addEventListener('resize',resizeGlow);
window.addEventListener('orientationchange',()=>setTimeout(resizeGlow,350));

// Orb data — positions in normalized screen space
const ORB_COUNT = 6;
const orbs = [];
const orbHues = [.65,.68,.72,.62,.70,.66]; // all blue-violet hues
for(let i=0;i<ORB_COUNT;i++){
  orbs.push({
    x: .2+Math.random()*.6,
    y: .2+Math.random()*.6,
    r: 60+Math.random()*80,    // pixel radius
    hue: orbHues[i],
    phase: Math.random()*Math.PI*2,
    speed: .04+Math.random()*.03, // drift speed
    opacity: 0,
    targetOpacity: 0,
    driftX: (Math.random()-.5)*.0002,
    driftY: (Math.random()-.5)*.0002,
    ttl: 200+Math.random()*300, // frames before next orb spawns here
    active: false,
  });
}

function drawOrbs(energy, sBass, sMid, t){
  glowCtx.clearRect(0,0,glowCanvas.width,glowCanvas.height);
  const W=glowCanvas.width, H=glowCanvas.height;

  for(const orb of orbs){
    // Slow theta-rhythm pulse (~0.1Hz = 6s period)
    // Music modulates amplitude subtly, not the rhythm itself
    const pulse = .5+.5*Math.sin(t*0.105*Math.PI*2+orb.phase); // 0.105Hz ~ theta
    const musicMod = 1+sMid*.3+sBass*.15;
    const finalR = orb.r*(0.7+pulse*.3)*musicMod;
    const finalOpacity = pulse*(0.12+energy*.08)*musicMod;

    // Slow drift
    orb.x+=orb.driftX; orb.y+=orb.driftY;
    if(orb.x<.05||orb.x>.95){orb.driftX*=-1;}
    if(orb.y<.05||orb.y>.95){orb.driftY*=-1;}

    const px=orb.x*W, py=orb.y*H;
    const grad=glowCtx.createRadialGradient(px,py,0,px,py,finalR);

    // Sleep palette: cool indigo/violet, very low saturation at edges
    const h=Math.round(orb.hue*360);
    grad.addColorStop(0,   `hsla(${h},60%,40%,${finalOpacity})`);
    grad.addColorStop(0.4, `hsla(${h},50%,25%,${finalOpacity*.5})`);
    grad.addColorStop(1,   `hsla(${h},40%,15%,0)`);

    glowCtx.fillStyle=grad;
    glowCtx.beginPath();
    glowCtx.arc(px,py,finalR,0,Math.PI*2);
    glowCtx.fill();
  }
}

// ══════════════════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════════════════
const AUDIO_URL='https://raw.githubusercontent.com/PyCHile/Music_pulse/main/music.mp3';
let actx=null,analyser=null,freq=null,audioSrcNode=null;
let playing=false,paused=false;

const audioEl=new Audio();
audioEl.crossOrigin='anonymous';audioEl.preload='none';audioEl.src=AUDIO_URL;

const loadWrap=document.getElementById('loadWrap');
const loadFill=document.getElementById('loadFill');
const loadTxt =document.getElementById('loadTxt');
function setLoad(p,t){loadFill.style.width=p+'%';loadTxt.textContent=t;}

document.getElementById('startBtn').addEventListener('click',async function(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(req)req.call(el).catch(()=>{});
  this.style.display='none';
  loadWrap.classList.add('show');
  setLoad(3,'Iniciando…');
  if(!actx){
    try{actx=new(window.AudioContext||window.webkitAudioContext)();await actx.resume();}
    catch(e){setLoad(0,'Error: '+e.message);return;}
  }
  if(!audioSrcNode){
    try{
      analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.88;
      freq=new Uint8Array(analyser.frequencyBinCount);
      audioSrcNode=actx.createMediaElementSource(audioEl);
      audioSrcNode.connect(analyser);analyser.connect(actx.destination);
    }catch(e){setLoad(0,'Error audio: '+e.message);return;}
  }
  setLoad(10,'Conectando…');
  audioEl.addEventListener('progress',onProgress);
  audioEl.addEventListener('canplay',onCanPlay,{once:true});
  audioEl.load();
  try{await audioEl.play();playing=true;paused=false;}
  catch(e){audioEl.addEventListener('canplay',async()=>{try{await audioEl.play();playing=true;paused=false;}catch(e2){}},{once:true});}
});

function onProgress(){
  try{if(audioEl.buffered.length>0&&audioEl.duration){const p=Math.min(98,(audioEl.buffered.end(0)/audioEl.duration)*100);setLoad(p,`Cargando ${Math.round(p)}%`);}}catch(_){}
}
function onCanPlay(){
  setLoad(100,'');
  audioEl.removeEventListener('progress',onProgress);
  document.getElementById('ui').classList.add('gone');
  showHudBriefly();
  setTimeout(()=>document.getElementById('hint').classList.add('show'),4000);
}
audioEl.addEventListener('pause',()=>{if(!paused)playing=false;});
audioEl.addEventListener('play', ()=>{playing=true;});
audioEl.addEventListener('ended',()=>{playing=false;});

let hudTimer=null;
function showHudBriefly(){
  const hud=document.getElementById('hud');
  hud.classList.add('visible');
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>{hud.classList.remove('visible');document.getElementById('hint').classList.add('show');},4000);
}

document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(audioEl.paused){actx.resume().then(()=>audioEl.play());document.getElementById('pauseBtn').textContent='⏸';playing=true;paused=false;}
  else{audioEl.pause();paused=true;playing=false;document.getElementById('pauseBtn').textContent='▶';}
});
document.getElementById('stopBtn').addEventListener('click',()=>{
  audioEl.pause();audioEl.currentTime=0;playing=false;paused=false;
  document.getElementById('hud').classList.remove('visible');
  document.getElementById('hint').classList.remove('show');
  document.getElementById('ui').classList.remove('gone');
  document.getElementById('startBtn').style.display='';
  loadWrap.classList.remove('show');
  const exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(exit)exit.call(document).catch(()=>{});
});

let touching=false,isDragging=false,holdT=null,lx=0,ly=0;
document.addEventListener('touchstart',e=>{
  if(!document.getElementById('ui').classList.contains('gone'))return;
  touching=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;isDragging=false;
  holdT=setTimeout(()=>isDragging=true,120);
  showHudBriefly();document.getElementById('hint').classList.remove('show');
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!touching)return;
  const dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;
  if(Math.abs(dx)>6||Math.abs(dy)>6)isDragging=true;
  if(isDragging){targetYaw+=dx*.003;targetPitch+=dy*.002;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
},{passive:true});
document.addEventListener('touchend',()=>{touching=false;clearTimeout(holdT);},{passive:true});
document.addEventListener('mousemove',e=>{targetYaw=(e.clientX/innerWidth-.5)*.45;targetPitch=(e.clientY/innerHeight-.5)*.22;});

// ══════════════════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════════════════
let t=0,camYaw=0,camPitch=0,targetYaw=0,targetPitch=0;
let sBass=0,sMid=0,sHi=0;
let inTurn=false,turnTarget=0,currentTurn=0,turnCooldown=0;
let ringColorTimer=0;
const MAX_YAW=.35,MAX_PITCH=.18;
let prevTime=performance.now();

function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min((now-prevTime)/1000,.05);
  prevTime=now; t+=dt;

  // ── Audio ─────────────────────────────────────────
  let bass=0,mid=0,hi=0;
  if(analyser&&playing){
    analyser.getByteFrequencyData(freq);
    const L=freq.length;
    for(let i=0;i<L*.05;i++) bass+=freq[i]; bass/=(L*.05*255);
    for(let i=L*.05|0;i<L*.25;i++) mid+=freq[i];  mid/=(L*.20*255);
    for(let i=L*.25|0;i<L*.70;i++) hi+=freq[i];   hi/=(L*.45*255);
  }
  // Very slow smoothing — avoids sudden brightness changes that disrupt sleep
  sBass+=(bass-sBass)*.07;
  sMid +=(mid -sMid )*.05;
  sHi  +=(hi  -sHi  )*.04;
  const energy=sBass*.5+sMid*.35+sHi*.15;

  // Speed: gentle base, modest music response — not jarring
  const warpSpeed=(5+sBass*28+sMid*10)*dt;

  // ── Beat-driven turns — slow, smooth ─────────────
  turnCooldown=Math.max(0,turnCooldown-dt);
  if(playing&&bass>.5&&sBass>.38&&turnCooldown<=0&&!inTurn){
    turnTarget=(Math.random()-.5)*.25; // subtle turn
    inTurn=true;currentTurn=0;turnCooldown=5+Math.random()*4; // long pauses
  }
  if(inTurn){
    const rem=turnTarget-currentTurn,step=rem*Math.min(1,dt*1.8); // slow easing
    targetYaw+=step;currentTurn+=step;
    if(Math.abs(rem)<.002)inTurn=false;
  }
  targetYaw  =Math.max(-MAX_YAW,  Math.min(MAX_YAW,  targetYaw));
  targetPitch=Math.max(-MAX_PITCH,Math.min(MAX_PITCH,targetPitch));

  // Ultra-smooth camera — sleep-inducing slow motion
  camYaw  +=(targetYaw  -camYaw)  *1.5*dt;
  camPitch+=(targetPitch-camPitch)*1.5*dt;

  camera.rotation.order='YXZ';
  camera.rotation.y=camYaw  +Math.sin(t*.15)*.01;
  camera.rotation.x=camPitch+Math.sin(t*.12)*.007;
  camera.rotation.z=Math.sin(t*.08)*.008+sBass*.012;

  const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  camera.position.addScaledVector(dir,warpSpeed);
  const cr=Math.sqrt(camera.position.x**2+camera.position.y**2);
  if(cr>5){camera.position.x*=5/cr;camera.position.y*=5/cr;}

  const camZ=camera.position.z,cx=camera.position.x,cy=camera.position.y;
  const streakLen=.3+warpSpeed*8+sBass*2.5;

  // ── Streaks ───────────────────────────────────────
  const posA=sGeo.attributes.position,colA=sGeo.attributes.color;
  for(let i=0;i<STREAK_COUNT;i++){
    const b=i*6;
    if(posA.array[b+5]>camZ+1){placeStreak(i,cx,cy,camZ);setSleepColor(b,energy);}
    else posA.array[b+2]=posA.array[b+5]-streakLen;
    // Dim tail very aggressively — keeps scene dark overall
    colA.array[b]*=.30;colA.array[b+1]*=.30;colA.array[b+2]*=.30;
  }
  posA.needsUpdate=true;colA.needsUpdate=true;

  // ── Background dots ───────────────────────────────
  const bpa=bgGeo.attributes.position;
  for(let i=0;i<BG;i++){
    if(bpa.array[i*3+2]>camZ+4){
      const a=Math.random()*Math.PI*2,r=1+Math.random()*20;
      bpa.array[i*3]=cx+Math.cos(a)*r;bpa.array[i*3+1]=cy+Math.sin(a)*r;
      bpa.array[i*3+2]=camZ-15-Math.random()*150;
    }
  }
  bpa.needsUpdate=true;
  bgMat.opacity=.35+sMid*.25;

  // ── Nebula haze ───────────────────────────────────
  const npa=nGeo.attributes.position;
  for(let i=0;i<NEB;i++){
    if(npa.array[i*3+2]>camZ+10){
      const a=Math.random()*Math.PI*2,r=2+Math.random()*18;
      npa.array[i*3]=cx+Math.cos(a)*r;npa.array[i*3+1]=cy+Math.sin(a)*r;
      npa.array[i*3+2]=camZ-15-Math.random()*140;
    }
  }
  npa.needsUpdate=true;
  nMat.opacity=.02+sMid*.06+sHi*.04;
  nMat.size=3.5+energy*4;

  // ── Rings ─────────────────────────────────────────
  for(const r of rings){
    r.position.z+=warpSpeed*2.5;
    const rs=1+sBass*.18;r.scale.set(rs,rs,1);
    r.material.opacity=.06+sMid*.22;
    r.rotation.z+=dt*.12;
    if(r.position.z>camZ+6){
      r.position.z=camZ-240-Math.random()*20;
      const hue=.62+Math.random()*.12;
      r.material.color.setHSL(hue,.7,.35+energy*.15);
    }
  }
  ringColorTimer+=dt;
  if(sBass>.55&&ringColorTimer>.5){
    ringColorTimer=0;
    for(const r of rings){const h=.62+Math.random()*.12;r.material.color.setHSL(h,.7,.4);}
  }

  // ── 2D glow orbs (separate canvas, zero GPU cost) ─
  drawOrbs(energy,sBass,sMid,t);

  // ── Camera — gentle FOV, no jarring changes ───────
  camera.fov=Math.max(78,Math.min(100,85+warpSpeed*.8+sBass*5));
  camera.updateProjectionMatrix();
  scene.fog.near=40+energy*15;scene.fog.far=150+energy*60;

  renderer.render(scene,camera);
}
loop();
</script>

</html>
