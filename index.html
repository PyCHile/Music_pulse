<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>Interstellar Visualizer</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,sans-serif;color:#fff}
    canvas{position:fixed;top:0;left:0;width:100%;height:100%}

    #ui{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity .7s}
    #ui.gone{opacity:0;pointer-events:none}

    h1{font-size:clamp(1.6rem,6vw,3rem);font-weight:200;letter-spacing:.35em;color:#d4a84b;text-transform:uppercase;margin-bottom:6px}
    .sub{font-size:.7rem;color:#444;letter-spacing:.25em;margin-bottom:50px}

    /* El label ES el botón — el input[file] está dentro del label
       Safari iOS dispara change correctamente cuando el label contiene el input */
    .load-label {
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;width:80%;max-width:360px;padding:38px 24px;
      border:1px solid #3a2a08;border-radius:12px;background:#080808;
      color:#c9a84c;font-size:1rem;letter-spacing:.1em;
      cursor:pointer;position:relative;overflow:hidden;
      -webkit-user-select:none;user-select:none;
    }
    .load-label:active{background:#0f0f0f;border-color:#c9a84c}

    .load-label input[type="file"]{
      /* Cubre todo el label — toque directo, Safari-safe */
      position:absolute;inset:0;width:100%;height:100%;
      opacity:0;cursor:pointer;font-size:16px;
      /* font-size:16px evita zoom automático en iOS */
    }

    .load-label svg{width:40px;height:40px;stroke:#c9a84c;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
    .load-label span{pointer-events:none}
    .load-label small{color:#444;font-size:.68rem;letter-spacing:.12em;pointer-events:none}

    #msg{margin-top:20px;font-size:.82rem;color:#666;text-align:center;max-width:320px;line-height:1.5;min-height:1.4em;padding:0 20px}
    #msg.err{color:#e05555}
    #msg.ok{color:#7bc47a}
    #msg.loading{color:#c9a84c}

    #spinner{display:none;width:28px;height:28px;margin-top:14px;border:2px solid #1a1a1a;border-top-color:#c9a84c;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    #hud{
      position:fixed;bottom:max(28px,env(safe-area-inset-bottom,28px));
      left:50%;transform:translateX(-50%);z-index:30;
      display:flex;align-items:center;gap:20px;
      background:rgba(0,0,0,.7);border:1px solid #2a1a05;border-radius:60px;
      padding:13px 30px;opacity:0;pointer-events:none;transition:opacity .5s;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap;
    }
    #hud.on{opacity:1;pointer-events:all}
    #hud button{background:none;border:none;color:#c9a84c;font-size:1.4rem;cursor:pointer;padding:4px 8px;-webkit-appearance:none;min-width:44px;min-height:44px}
    #tname{font-size:.72rem;color:#777;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    #back{position:fixed;top:max(18px,env(safe-area-inset-top,18px));left:18px;z-index:30;
      background:rgba(0,0,0,.6);border:1px solid #2a1a05;border-radius:20px;
      color:#666;font-size:.72rem;padding:10px 20px;cursor:pointer;
      opacity:0;pointer-events:none;transition:opacity .5s;
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      letter-spacing:.12em;-webkit-appearance:none;min-height:44px}
    #back.on{opacity:1;pointer-events:all}
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h1>Interstellar</h1>
  <p class="sub">Particle Audio Visualizer</p>

  <!--
    CLAVE para Safari iOS:
    - label contiene directamente el input[file]
    - El usuario toca el label → iOS abre el picker → change se dispara
    - NO usamos JS .click() — eso rompe Safari
  -->
  <label class="load-label">
    <input type="file" id="fileInput" accept="audio/*,audio/mpeg,audio/mp4,audio/wav,audio/ogg,audio/x-m4a,.mp3,.wav,.m4a,.ogg,.aac"/>
    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span>Toca para cargar audio</span>
    <small>MP3 · WAV · M4A · OGG</small>
  </label>

  <div id="spinner"></div>
  <div id="msg">Selecciona tu archivo de audio</div>
</div>

<div id="hud">
  <button id="pauseBtn" aria-label="Pausa">⏸</button>
  <span id="tname">—</span>
  <button id="stopBtn" aria-label="Detener">⏹</button>
</div>
<button id="back">← Volver</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ══════════════════════════════════════════
// THREE.JS SETUP
// ══════════════════════════════════════════
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
camera.position.z = 3.5;

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── Particles ──────────────────────────
const N = 12000;

function sphere(n){
  const p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=1+(Math.random()-.5)*.1;
    p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.sin(ph)*Math.sin(th);p[i*3+2]=r*Math.cos(ph);
  }return p;
}
function torus(n){
  const p=new Float32Array(n*3),R=1,r=.4;
  for(let i=0;i<n;i++){
    const u=Math.random()*Math.PI*2,v=Math.random()*Math.PI*2,rr=r+(Math.random()-.5)*.07;
    p[i*3]=(R+rr*Math.cos(v))*Math.cos(u);p[i*3+1]=(R+rr*Math.cos(v))*Math.sin(u);p[i*3+2]=rr*Math.sin(v);
  }return p;
}
function galaxy(n){
  const p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a=i%3,t=Math.random(),ang=t*Math.PI*3+a*(Math.PI*2/3),rad=t*1.4+.1,sp=.1*(1-t);
    p[i*3]=rad*Math.cos(ang)+(Math.random()-.5)*sp;p[i*3+1]=(Math.random()-.5)*.12;p[i*3+2]=rad*Math.sin(ang)+(Math.random()-.5)*sp;
  }return p;
}

const shapes=[sphere(N),torus(N),galaxy(N)];
let si=0,morphTgt=null,morphT=1;

const geo=new THREE.BufferGeometry();
const pArr=new Float32Array(shapes[0]);
const cArr=new Float32Array(N*3);
for(let i=0;i<N;i++){cArr[i*3]=.6+Math.random()*.4;cArr[i*3+1]=.28+Math.random()*.38;cArr[i*3+2]=.02+Math.random()*.1;}
geo.setAttribute('position',new THREE.BufferAttribute(pArr,3));
geo.setAttribute('color',   new THREE.BufferAttribute(cArr,3));

const mat=new THREE.PointsMaterial({size:.007,vertexColors:true,transparent:true,opacity:.9,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
const pts=new THREE.Points(geo,mat);
scene.add(pts);

setInterval(()=>{if(playing){si=(si+1)%shapes.length;morphTgt=shapes[si];morphT=0;}},22000);

// ══════════════════════════════════════════
// AUDIO — Safari iOS safe
// ══════════════════════════════════════════
let actx=null,analyser=null,freq=null;
let srcNode=null,audioBuf=null;
let playing=false,paused=false,pauseAt=0,startAt=0;

const msgEl   =document.getElementById('msg');
const spinner =document.getElementById('spinner');
const fileInput=document.getElementById('fileInput');

function setMsg(t,cls=''){msgEl.textContent=t;msgEl.className=cls;}
function spin(v){spinner.style.display=v?'block':'none';}

fileInput.addEventListener('change',function(){
  const file=this.files[0];
  if(!file)return;
  this.value='';

  setMsg('Iniciando audio…','loading');
  spin(true);

  // Crear AudioContext aquí — dentro del event handler de change
  // En Safari iOS, 'change' de input[file] cuenta como gesto de usuario
  try{
    if(actx){try{actx.close();}catch(_){}}
    actx=new(window.AudioContext||window.webkitAudioContext)();
  }catch(e){
    spin(false);setMsg('Web Audio no disponible: '+e.message,'err');return;
  }

  setMsg('Leyendo archivo…','loading');

  const reader=new FileReader();

  reader.onload=function(ev){
    const buf=ev.target.result;
    setMsg('Decodificando…','loading');

    // Callback API (no Promise) — más compatible con Safari antiguo
    actx.decodeAudioData(buf,
      function(decoded){
        spin(false);
        audioBuf=decoded;
        document.getElementById('tname').textContent=file.name.replace(/\.[^.]+$/,'');
        playBuf(0);
        showViz();
        setMsg('','ok');
      },
      function(err){
        spin(false);
        setMsg('No se pudo decodificar. Intenta con un archivo WAV.','err');
        console.error('decodeAudioData:',err);
      }
    );
  };

  reader.onerror=function(){
    spin(false);setMsg('Error leyendo archivo.','err');
  };

  reader.readAsArrayBuffer(file);
});

function playBuf(offset){
  if(srcNode){try{srcNode.stop();}catch(_){}}
  analyser=actx.createAnalyser();
  analyser.fftSize=1024;
  analyser.smoothingTimeConstant=.85;
  freq=new Uint8Array(analyser.frequencyBinCount);
  srcNode=actx.createBufferSource();
  srcNode.buffer=audioBuf;
  srcNode.connect(analyser);
  analyser.connect(actx.destination);
  actx.resume().then(()=>{
    srcNode.start(0,offset);
    startAt=actx.currentTime-offset;
    playing=true;paused=false;
    srcNode.onended=()=>{if(!paused)playing=false;};
  });
}

function showViz(){
  document.getElementById('ui').classList.add('gone');
  document.getElementById('hud').classList.add('on');
  document.getElementById('back').classList.add('on');
  document.getElementById('pauseBtn').textContent='⏸';
}

function stopAll(){
  if(srcNode){try{srcNode.stop();}catch(_){}srcNode=null;}
  if(actx){try{actx.close();}catch(_){}actx=null;}
  playing=false;paused=false;analyser=null;
  document.getElementById('hud').classList.remove('on');
  document.getElementById('back').classList.remove('on');
  document.getElementById('ui').classList.remove('gone');
  setMsg('Selecciona tu archivo de audio');
}

document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!actx||!srcNode)return;
  if(paused){
    playBuf(pauseAt);
    document.getElementById('pauseBtn').textContent='⏸';
  }else{
    pauseAt=actx.currentTime-startAt;
    try{srcNode.stop();}catch(_){}
    playing=false;paused=true;
    document.getElementById('pauseBtn').textContent='▶';
  }
});
document.getElementById('stopBtn').addEventListener('click',stopAll);
document.getElementById('back').addEventListener('click',stopAll);

// ══════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════
let t=0,dragX=0,dragY=0,lx=0,ly=0;
cv.addEventListener('touchstart',e=>{lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchmove', e=>{
  dragX+=(e.touches[0].clientX-lx)*.005;
  dragY+=(e.touches[0].clientY-ly)*.003;
  lx=e.touches[0].clientX;ly=e.touches[0].clientY;
},{passive:true});

const pa=geo.attributes.position,ca=geo.attributes.color;

function loop(){
  requestAnimationFrame(loop);
  t+=.004;

  let bass=0,mid=0,hi=0;
  if(analyser&&playing){
    analyser.getByteFrequencyData(freq);
    const L=freq.length;
    for(let i=0;i<L*.08;i++)bass+=freq[i];bass/=(L*.08*255);
    for(let i=L*.08|0;i<L*.4;i++)mid+=freq[i];mid/=(L*.32*255);
    for(let i=L*.4|0;i<L*.75;i++)hi+=freq[i];hi/=(L*.35*255);
  }

  if(morphTgt&&morphT<1)morphT=Math.min(1,morphT+.001+bass*.008);
  const from=shapes[(si-1+shapes.length)%shapes.length],to=shapes[si];
  const pulse=1+bass*.5,breath=1+.025*Math.sin(t*.7);

  for(let i=0;i<N;i++){
    let x,y,z;
    if(morphTgt&&morphT<1){
      const e=morphT<.5?4*morphT*morphT*morphT:1-Math.pow(-2*morphT+2,3)/2;
      x=from[i*3]+(to[i*3]-from[i*3])*e;
      y=from[i*3+1]+(to[i*3+1]-from[i*3+1])*e;
      z=from[i*3+2]+(to[i*3+2]-from[i*3+2])*e;
    }else{x=to[i*3];y=to[i*3+1];z=to[i*3+2];}

    if(bass>.5){const s=(bass-.5)*.25;x+=(Math.random()-.5)*s;y+=(Math.random()-.5)*s;z+=(Math.random()-.5)*s;}
    pa.array[i*3]=x*pulse*breath;pa.array[i*3+1]=y*pulse*breath;pa.array[i*3+2]=z*pulse*breath;

    const br=1+mid*.9;
    ca.array[i*3]=Math.min(1,(.55+(i%7/6)*.45)*br);
    ca.array[i*3+1]=Math.min(1,(.22+(i%5/4)*.35)*br);
    ca.array[i*3+2]=Math.min(1,.02+hi*.22*br);
  }
  pa.needsUpdate=true;ca.needsUpdate=true;

  pts.rotation.y=t*.07+dragX;
  pts.rotation.x=Math.sin(t*.04)*.1+dragY;
  pts.rotation.z=t*.015;
  mat.size=.007+bass*.007;
  renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
