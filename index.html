<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Interstellar"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#000000"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Interstellar Journey</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;inset:0}
    canvas{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}

    /* Mask the system status bar (time, signal, battery).
       A black-to-transparent gradient on top blends it into space.
       Height covers iOS status bar (~50px) + safe area. */
    #statusMask{
      position:fixed;top:0;left:0;right:0;
      height:max(54px, env(safe-area-inset-top, 54px));
      background:linear-gradient(to bottom, rgba(0,0,8,1) 0%, rgba(0,0,8,.85) 55%, transparent 100%);
      z-index:100;
      pointer-events:none;
    }

    #ui{
      position:fixed;inset:0;z-index:20;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at center,#030810 0%,#000 70%);
      transition:opacity 1.5s ease;
    }
    #ui.gone{opacity:0;pointer-events:none}

    .title{font-size:clamp(1.2rem,4.5vw,2.6rem);font-weight:100;letter-spacing:.55em;color:#7aabdd;text-transform:uppercase;margin-bottom:6px;text-align:center}
    .subtitle{font-size:.6rem;color:#1a2a3a;letter-spacing:.4em;margin-bottom:12px;text-align:center;text-transform:uppercase}

    #pwaHint{font-size:.52rem;color:#0d1825;letter-spacing:.16em;margin-bottom:44px;text-align:center;text-transform:uppercase;max-width:260px;line-height:1.9}

    #startBtn{
      width:130px;height:130px;border-radius:50%;border:1px solid #1a3050;
      background:none;cursor:pointer;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:6px;
      color:#4a7aaa;font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;
      position:relative;-webkit-appearance:none;
    }
    #startBtn::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid #0a1525;animation:pr 3s ease-out infinite}
    #startBtn::before{content:'';position:absolute;inset:-22px;border-radius:50%;border:1px solid #050c18;animation:pr 3s ease-out infinite .8s}
    @keyframes pr{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
    #startBtn svg{width:30px;height:30px;fill:#4a7aaa;stroke:none}
    #startBtn:active{border-color:#4a7aaa;background:rgba(74,122,170,.08)}

    #loadWrap{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:32px}
    #loadWrap.show{display:flex}
    #loadBar{width:220px;height:1px;background:#0a1020;position:relative}
    #loadFill{position:absolute;top:0;left:0;height:100%;background:#4a7aaa;width:0%;transition:width .3s}
    #loadTxt{font-size:.62rem;color:#2a3a4a;letter-spacing:.15em}

    #hud{
      position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));
      left:50%;transform:translateX(-50%);z-index:30;
      display:flex;align-items:center;gap:16px;
      background:rgba(0,5,15,.8);border:1px solid #0a1a2a;border-radius:50px;
      padding:10px 24px;opacity:0;pointer-events:none;transition:opacity .6s;
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;
    }
    #hud.visible{opacity:1;pointer-events:all}
    #hud button{background:none;border:none;color:#4a7aaa;font-size:1.2rem;cursor:pointer;padding:4px 8px;min-width:44px;min-height:44px;-webkit-appearance:none}
    #tname{font-size:.68rem;color:#1a2a3a;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    #hint{
      position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));
      left:50%;transform:translateX(-50%);z-index:28;
      font-size:.56rem;color:#0d1a26;letter-spacing:.2em;text-transform:uppercase;
      opacity:0;transition:opacity 1s;pointer-events:none;white-space:nowrap;
    }
    #hint.show{opacity:1}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="statusMask"></div>

<div id="ui">
  <div class="title">Interstellar</div>
  <div class="subtitle">Journey Through Space</div>
  <div id="pwaHint"></div>
  <button id="startBtn">
    <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    Iniciar
  </button>
  <div id="loadWrap">
    <div id="loadBar"><div id="loadFill"></div></div>
    <div id="loadTxt"></div>
  </div>
</div>

<div id="hud">
  <button id="pauseBtn">⏸</button>
  <span id="tname">Interstellar</span>
  <button id="stopBtn">⏹</button>
</div>
<div id="hint">toca para controles · arrastra para girar</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── PWA hint ────────────────────────────────────────────
if (!window.matchMedia('(display-mode: fullscreen)').matches && !navigator.standalone) {
  document.getElementById('pwaHint').textContent = '⋮ → Añadir a pantalla de inicio para pantalla completa';
}

// ── Renderer ────────────────────────────────────────────
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x00000a);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x00000a, 50, 180);
const camera = new THREE.PerspectiveCamera(85, innerWidth/innerHeight, 0.01, 400);

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 350));

// ── Star streaks ────────────────────────────────────────
const STREAK_COUNT = 3500;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(STREAK_COUNT * 6);
const sCol = new Float32Array(STREAK_COUNT * 6);
for (let i = 0; i < STREAK_COUNT; i++) placeStreak(i, 0, 0, 0);
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sGeo.setAttribute('color',    new THREE.BufferAttribute(sCol, 3));
const streaks = new THREE.LineSegments(sGeo, new THREE.LineBasicMaterial({
  vertexColors:true, transparent:true, opacity:.95,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
scene.add(streaks);

function placeStreak(i, cx, cy, camZ) {
  const b      = i * 6;
  const angle  = Math.random() * Math.PI * 2;
  const rnd    = Math.random();
  const radius = 3 + rnd * rnd * 20;
  const z      = camZ - 10 - Math.random() * 150;
  const x      = cx + Math.cos(angle) * radius;
  const y      = cy + Math.sin(angle) * radius;
  sPos[b]=x; sPos[b+1]=y; sPos[b+2]=z - 0.3; // tail
  sPos[b+3]=x; sPos[b+4]=y; sPos[b+5]=z;      // head
  colorStreak(b, 0, 0);
}

function colorStreak(b, sMid, hi) {
  const warm   = Math.random() < 0.12;
  const bright = 0.5 + Math.random() * 0.5;
  if (warm) {
    sCol[b]=bright;    sCol[b+1]=bright*.6; sCol[b+2]=bright*.1;
    sCol[b+3]=1;       sCol[b+4]=.85;       sCol[b+5]=.35;
  } else {
    const rb = .55+sMid*.3, gb = .78+hi*.2;
    sCol[b]=bright*rb; sCol[b+1]=bright*gb; sCol[b+2]=bright;
    sCol[b+3]=rb;      sCol[b+4]=gb;        sCol[b+5]=1;
  }
}

// ── Background dots ─────────────────────────────────────
const BG = 2000;
const bgGeo = new THREE.BufferGeometry();
const bgPos = new Float32Array(BG*3), bgCol = new Float32Array(BG*3);
for (let i = 0; i < BG; i++) {
  const a=Math.random()*Math.PI*2, r=1+Math.random()*22;
  bgPos[i*3]=Math.cos(a)*r; bgPos[i*3+1]=Math.sin(a)*r; bgPos[i*3+2]=-Math.random()*160;
  const b=.3+Math.random()*.7; bgCol[i*3]=b*.6; bgCol[i*3+1]=b*.75; bgCol[i*3+2]=b;
}
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos,3));
bgGeo.setAttribute('color',    new THREE.BufferAttribute(bgCol,3));
const bgMat = new THREE.PointsMaterial({size:.06, vertexColors:true, transparent:true, opacity:.7,
  sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(bgGeo, bgMat));

// ── Nebula ──────────────────────────────────────────────
const NEB = 800;
const nGeo = new THREE.BufferGeometry();
const nPos = new Float32Array(NEB*3), nCol = new Float32Array(NEB*3);
const nebPal = [[.15,.35,.9],[.45,.1,.75],[.1,.55,.5],[.65,.12,.22],[.05,.22,.72]];
for (let i = 0; i < NEB; i++) {
  const a=Math.random()*Math.PI*2, r=2+Math.random()*18;
  nPos[i*3]=Math.cos(a)*r; nPos[i*3+1]=Math.sin(a)*r; nPos[i*3+2]=-Math.random()*150;
  const c=nebPal[i%nebPal.length]; nCol[i*3]=c[0]; nCol[i*3+1]=c[1]; nCol[i*3+2]=c[2];
}
nGeo.setAttribute('position', new THREE.BufferAttribute(nPos,3));
nGeo.setAttribute('color',    new THREE.BufferAttribute(nCol,3));
const nMat = new THREE.PointsMaterial({size:3.5, vertexColors:true, transparent:true, opacity:.045,
  sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(nGeo, nMat));

// ── Galactic cloud spheres — luminous orbs you fly through ──
// Each is a dense sphere of particles with its own color and position
// They spawn ahead, you fly into and through them
const CLOUD_SPHERES = 12;
const PTS_PER_CLOUD = 320;
const cloudMeshes   = [];
const cloudData     = []; // {baseX, baseY, baseZ, radius, hue}

const cloudColors = [
  [0.55, 0.75, 1.00], // ice blue
  [0.80, 0.40, 1.00], // violet
  [0.20, 0.80, 0.70], // teal
  [1.00, 0.55, 0.20], // amber
  [0.30, 0.50, 1.00], // cobalt
  [1.00, 0.30, 0.50], // rose
];

for (let s = 0; s < CLOUD_SPHERES; s++) {
  const cGeo = new THREE.BufferGeometry();
  const cPos = new Float32Array(PTS_PER_CLOUD * 3);
  const cCol = new Float32Array(PTS_PER_CLOUD * 3);

  const col = cloudColors[s % cloudColors.length];
  for (let i = 0; i < PTS_PER_CLOUD; i++) {
    // Uniform sphere distribution
    const u  = Math.random(), v = Math.random();
    const th = 2 * Math.PI * u;
    const ph = Math.acos(2*v - 1);
    const r  = Math.random(); // volume fill
    cPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    cPos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
    cPos[i*3+2] = r * Math.cos(ph);
    // Color: core brighter, edges dimmer
    const br = 0.4 + r * 0.6;
    cCol[i*3]   = col[0] * br;
    cCol[i*3+1] = col[1] * br;
    cCol[i*3+2] = col[2] * br;
  }
  cGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
  cGeo.setAttribute('color',    new THREE.BufferAttribute(cCol, 3));

  const cMat = new THREE.PointsMaterial({
    size: 0.28, vertexColors: true,
    transparent: true, opacity: 0.0,  // start invisible, fade in
    sizeAttenuation: true, depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const cloud = new THREE.Points(cGeo, cMat);
  cloud.scale.setScalar(4 + Math.random() * 5); // radius 4–9 world units

  // Distribute along tunnel, offset from center
  const angle  = Math.random() * Math.PI * 2;
  const offset = 3 + Math.random() * 5;
  cloud.position.set(
    Math.cos(angle) * offset,
    Math.sin(angle) * offset,
    -(30 + s * 22 + Math.random() * 15)
  );

  scene.add(cloud);
  cloudMeshes.push(cloud);
  cloudData.push({
    hue:    s / CLOUD_SPHERES,
    radius: cloud.scale.x,
    col:    col,
  });
}

// Ring radius chosen so it fits screen regardless of orientation
function ringRadius() {
  // Project a circle at z=-20 and see how big it needs to be to frame the view
  return Math.min(innerWidth, innerHeight) * 0.38;
}

const rings = [];
for (let i = 0; i < 22; i++) spawnRing(-i*12 - 5);

function spawnRing(z) {
  const segs = 100;
  const geo  = new THREE.BufferGeometry();
  const pos  = new Float32Array(segs * 6);
  const R    = 16; // world units — camera FOV handles perspective scaling
  for (let i = 0; i < segs; i++) {
    const a1=(i/segs)*Math.PI*2, a2=((i+1)/segs)*Math.PI*2;
    pos[i*6]=Math.cos(a1)*R;   pos[i*6+1]=Math.sin(a1)*R;   pos[i*6+2]=0;
    pos[i*6+3]=Math.cos(a2)*R; pos[i*6+4]=Math.sin(a2)*R;   pos[i*6+5]=0;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.LineBasicMaterial({
    color: new THREE.Color().setHSL(Math.random(),.9,.6),
    transparent:true, opacity:.22, blending:THREE.AdditiveBlending, depthWrite:false
  });
  const ring = new THREE.LineSegments(geo, mat);
  ring.position.z = z;
  scene.add(ring); rings.push(ring);
}

// ══════════════════════════════════════════════════════
// AUDIO — single MediaElementSource, created once
// ══════════════════════════════════════════════════════
const AUDIO_URL = 'https://raw.githubusercontent.com/PyCHile/Music_pulse/main/music.mp3';
let actx     = null;
let analyser = null;
let freq     = null;
let audioSrcNode = null; // MediaElementSourceNode — only create ONCE
let playing  = false;
let paused   = false;

const audioEl   = new Audio();
audioEl.crossOrigin = 'anonymous';
audioEl.preload     = 'none';
audioEl.src         = AUDIO_URL;

audioEl.addEventListener('error', () => {
  document.getElementById('loadTxt').textContent = 'Error de red. Recarga.';
});

const loadWrap = document.getElementById('loadWrap');
const loadFill = document.getElementById('loadFill');
const loadTxt  = document.getElementById('loadTxt');
function setLoad(p, t) { loadFill.style.width=p+'%'; loadTxt.textContent=t; }

document.getElementById('startBtn').addEventListener('click', async function() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (req) req.call(el).catch(()=>{});

  this.style.display = 'none';
  loadWrap.classList.add('show');
  setLoad(3, 'Iniciando…');

  // Create AudioContext once
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      await actx.resume();
    } catch(e) { setLoad(0,'Error AudioContext: '+e.message); return; }
  }

  // Create MediaElementSource ONCE — reusing it on restart causes the error
  if (!audioSrcNode) {
    try {
      analyser = actx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.82;
      freq = new Uint8Array(analyser.frequencyBinCount);

      audioSrcNode = actx.createMediaElementSource(audioEl);
      audioSrcNode.connect(analyser);
      analyser.connect(actx.destination);
    } catch(e) { setLoad(0,'Error audio: '+e.message); return; }
  }

  setLoad(10, 'Conectando stream…');

  // Track buffer progress
  audioEl.addEventListener('progress', onProgress);
  audioEl.addEventListener('canplay',  onCanPlay, { once:true });

  audioEl.load();

  try {
    await audioEl.play();
    playing = true; paused = false;
  } catch(e) {
    // Some browsers need canplay first
    audioEl.addEventListener('canplay', async () => {
      try { await audioEl.play(); playing=true; paused=false; }
      catch(e2) { setLoad(0,'No se pudo reproducir.'); }
    }, { once:true });
  }
});

function onProgress() {
  try {
    if (audioEl.buffered.length > 0 && audioEl.duration) {
      const pct = Math.min(98, (audioEl.buffered.end(0) / audioEl.duration) * 100);
      setLoad(pct, `Cargando ${Math.round(pct)}%`);
    }
  } catch(_) {}
}

function onCanPlay() {
  setLoad(100, '');
  audioEl.removeEventListener('progress', onProgress);
  document.getElementById('ui').classList.add('gone');
  showHudBriefly();
  setTimeout(() => document.getElementById('hint').classList.add('show'), 3500);
}

audioEl.addEventListener('pause',  () => { if (!paused) playing=false; });
audioEl.addEventListener('play',   () => { playing=true; });
audioEl.addEventListener('ended',  () => { playing=false; });

// ── HUD auto-hide ───────────────────────────────────────
let hudTimer = null;
function showHudBriefly() {
  const hud = document.getElementById('hud');
  hud.classList.add('visible');
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => {
    hud.classList.remove('visible');
    document.getElementById('hint').classList.add('show');
  }, 3500);
}

document.getElementById('pauseBtn').addEventListener('click', () => {
  if (audioEl.paused) {
    actx.resume().then(() => audioEl.play());
    document.getElementById('pauseBtn').textContent = '⏸';
    playing=true; paused=false;
  } else {
    audioEl.pause(); paused=true; playing=false;
    document.getElementById('pauseBtn').textContent = '▶';
  }
});

document.getElementById('stopBtn').addEventListener('click', () => {
  audioEl.pause(); audioEl.currentTime=0;
  playing=false; paused=false;
  document.getElementById('hud').classList.remove('visible');
  document.getElementById('hint').classList.remove('show');
  document.getElementById('ui').classList.remove('gone');
  document.getElementById('startBtn').style.display='';
  loadWrap.classList.remove('show');
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (exit) exit.call(document).catch(()=>{});
});

// ── Touch controls ──────────────────────────────────────
let touching=false, isDragging=false, holdT=null, lx=0, ly=0;

document.addEventListener('touchstart', e => {
  if (!document.getElementById('ui').classList.contains('gone')) return;
  touching=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY;
  isDragging=false;
  holdT=setTimeout(()=>isDragging=true, 120);
  showHudBriefly();
  document.getElementById('hint').classList.remove('show');
}, {passive:true});

document.addEventListener('touchmove', e => {
  if (!touching) return;
  const dx=e.touches[0].clientX-lx, dy=e.touches[0].clientY-ly;
  if (Math.abs(dx)>6||Math.abs(dy)>6) isDragging=true;
  if (isDragging) {
    targetYaw   += dx * 0.003;
    targetPitch += dy * 0.002;
    lx=e.touches[0].clientX; ly=e.touches[0].clientY;
  }
}, {passive:true});

document.addEventListener('touchend', () => { touching=false; clearTimeout(holdT); }, {passive:true});
document.addEventListener('mousemove', e => {
  targetYaw   = (e.clientX/innerWidth  - .5) * .45;
  targetPitch = (e.clientY/innerHeight - .5) * .22;
});

// ══════════════════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════════════════
let t=0, camYaw=0, camPitch=0, targetYaw=0, targetPitch=0;
let sBass=0, sMid=0, sHi=0;

// Turn system: music-tempo aware
// Instead of fixed timer, detect beats and accumulate
let turnBudget    = 0;   // accumulates on energy
let currentTurn   = 0;   // how much we've turned this beat
let turnTarget    = 0;   // target turn delta
let inTurn        = false;
let turnCooldown  = 0;   // cooldown between turns (in seconds)
let ringColorTimer = 0;

const MAX_YAW   = 0.38;
const MAX_PITCH = 0.20;
let prevTime = performance.now();

function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt  = Math.min((now - prevTime) / 1000, 0.05);
  prevTime  = now; t += dt;

  // ── Audio analysis ─────────────────────────────────
  let bass=0, mid=0, hi=0;
  if (analyser && playing) {
    analyser.getByteFrequencyData(freq);
    const L = freq.length;
    for (let i=0; i<L*.05; i++) bass+=freq[i]; bass/=(L*.05*255);
    for (let i=L*.05|0; i<L*.25; i++) mid+=freq[i];  mid/=(L*.20*255);
    for (let i=L*.25|0; i<L*.70; i++) hi+=freq[i];   hi/=(L*.45*255);
  }

  // Smooth with slower attack for more musical feel
  sBass += (bass - sBass) * 0.12;
  sMid  += (mid  - sMid)  * 0.08;
  sHi   += (hi   - sHi)   * 0.06;
  const energy = sBass*.55 + sMid*.3 + sHi*.15;

  // ── Music-driven speed ─────────────────────────────
  // Slow base, surges on energy peaks — feels musical
  const warpSpeed = (6 + sBass*38 + sMid*12) * dt;

  // ── Music-driven turns ─────────────────────────────
  // Accumulate "turn budget" from bass energy
  // Only turn when we have enough budget AND cooldown is done
  turnCooldown = Math.max(0, turnCooldown - dt);

  if (playing) {
    // Beat detection: sudden bass spike above threshold triggers a turn
    if (bass > 0.55 && sBass > 0.4 && turnCooldown <= 0 && !inTurn) {
      // New turn — magnitude proportional to bass, direction random
      turnTarget  = (Math.random() - 0.5) * 0.3; // yaw only, subtle
      inTurn      = true;
      currentTurn = 0;
      turnCooldown = 3.5 + Math.random() * 3; // long pause between turns
    }
  }

  // Execute turn gradually (smooth easing)
  if (inTurn) {
    const remaining = turnTarget - currentTurn;
    const step      = remaining * Math.min(1, dt * 2.5);
    targetYaw      += step;
    currentTurn    += step;
    if (Math.abs(remaining) < 0.002) {
      inTurn = false; // turn complete
    }
  }

  // Clamp camera angle
  targetYaw   = Math.max(-MAX_YAW,   Math.min(MAX_YAW,   targetYaw));
  targetPitch = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, targetPitch));

  // Smooth interpolation
  camYaw   += (targetYaw   - camYaw)   * 2.2 * dt;
  camPitch += (targetPitch - camPitch) * 2.2 * dt;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = camYaw   + Math.sin(t*.2) * 0.012;
  camera.rotation.x = camPitch + Math.sin(t*.15)* 0.008;
  camera.rotation.z = Math.sin(t*.1) * 0.01 + sBass * 0.015;

  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  camera.position.addScaledVector(dir, warpSpeed);

  // Keep camera near tunnel center
  const cr = Math.sqrt(camera.position.x**2 + camera.position.y**2);
  if (cr > 6) { camera.position.x *= 6/cr; camera.position.y *= 6/cr; }

  const camZ = camera.position.z;
  const cx   = camera.position.x;
  const cy   = camera.position.y;

  // Streak length scales with speed + bass
  const streakLen = 0.4 + warpSpeed * 7 + sBass * 3;

  // ── Update streaks ──────────────────────────────────
  const posA = sGeo.attributes.position;
  const colA = sGeo.attributes.color;
  for (let i = 0; i < STREAK_COUNT; i++) {
    const b = i * 6;
    if (posA.array[b+5] > camZ + 1) {
      placeStreak(i, cx, cy, camZ);
      colorStreak(b, sMid, sHi);
    } else {
      posA.array[b+2] = posA.array[b+5] - streakLen;
    }
    // Dim tail
    colA.array[b]   *= 0.35; colA.array[b+1] *= 0.35; colA.array[b+2] *= 0.35;
  }
  posA.needsUpdate = true; colA.needsUpdate = true;

  // ── Background dots ─────────────────────────────────
  const bpa = bgGeo.attributes.position;
  for (let i = 0; i < BG; i++) {
    if (bpa.array[i*3+2] > camZ + 4) {
      const a=Math.random()*Math.PI*2, r=1+Math.random()*20;
      bpa.array[i*3]=cx+Math.cos(a)*r; bpa.array[i*3+1]=cy+Math.sin(a)*r;
      bpa.array[i*3+2]=camZ-15-Math.random()*150;
    }
  }
  bpa.needsUpdate = true;
  bgMat.opacity   = 0.45 + sMid * 0.35;

  // ── Nebula ──────────────────────────────────────────
  const npa = nGeo.attributes.position;
  for (let i = 0; i < NEB; i++) {
    if (npa.array[i*3+2] > camZ + 10) {
      const a=Math.random()*Math.PI*2, r=2+Math.random()*18;
      npa.array[i*3]=cx+Math.cos(a)*r; npa.array[i*3+1]=cy+Math.sin(a)*r;
      npa.array[i*3+2]=camZ-15-Math.random()*140;
    }
  }
  npa.needsUpdate = true;
  nMat.opacity    = 0.025 + sMid * 0.08 + sHi * 0.06;
  nMat.size       = 3 + energy * 4.5;

  // ── Rings — move with warp, pulse on bass ───────────
  for (const r of rings) {
    r.position.z += warpSpeed * 2.8;
    const rs = 1 + sBass * 0.22; r.scale.set(rs, rs, 1);
    r.material.opacity = 0.08 + sMid * 0.28;
    r.rotation.z += dt * 0.15;
    if (r.position.z > camZ + 6) {
      r.position.z = camZ - 240 - Math.random()*20;
      r.material.color.setHSL(Math.random(), .88, .5 + energy*.22);
    }
  }
  ringColorTimer += dt;
  if (sBass > 0.6 && ringColorTimer > 0.3) {
    ringColorTimer = 0;
    for (const r of rings) r.material.color.setHSL(Math.random(), 1, .72);
  }

  // ── Camera FOV warp — musical ───────────────────────
  camera.fov = Math.max(72, Math.min(110, 85 + warpSpeed + sBass * 7));
  camera.updateProjectionMatrix();

  scene.fog.near = 35 + energy * 18;
  scene.fog.far  = 140 + energy * 70;

  // ── Galactic cloud spheres ─────────────────────────
  for (let s = 0; s < CLOUD_SPHERES; s++) {
    const cloud = cloudMeshes[s];
    const cd    = cloudData[s];
    const mat   = cloud.material;

    // Move with the warp (same speed as rings)
    cloud.position.z += warpSpeed * 2.8;

    // Distance from camera to cloud center
    const dz   = cloud.position.z - camZ;
    const dx   = cloud.position.x - cx;
    const dy   = cloud.position.y - cy;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
    const R    = cd.radius;

    // Fade in as we approach, peak opacity when inside, fade out behind
    let opacity = 0;
    if (dz < 0 && dz > -R * 3) {
      // Approaching — fade in
      opacity = Math.max(0, 1 - Math.abs(dz) / (R * 3));
    } else if (dz >= 0 && dz < R) {
      // We're inside or just passed — glow
      opacity = 1 - dz / R;
    }

    // Pulse with music
    mat.opacity = Math.min(0.75, opacity * (0.35 + sBass * 0.45 + sMid * 0.2));
    mat.size    = 0.22 + sBass * 0.18 + sHi * 0.08;

    // Slow rotation for living feel
    cloud.rotation.y += dt * 0.08;
    cloud.rotation.x += dt * 0.05;

    // Respawn ahead when fully behind camera
    if (cloud.position.z > camZ + R + 5) {
      const angle  = Math.random() * Math.PI * 2;
      const offset = 2 + Math.random() * 6;
      cloud.position.set(
        cx + Math.cos(angle) * offset,
        cy + Math.sin(angle) * offset,
        camZ - 200 - Math.random() * 60
      );
      cloud.scale.setScalar(4 + Math.random() * 5);
      cd.radius = cloud.scale.x;
      // New color on respawn
      const newCol = cloudColors[Math.floor(Math.random() * cloudColors.length)];
      cd.col = newCol;
      const cColArr = cloud.geometry.attributes.color.array;
      for (let i = 0; i < PTS_PER_CLOUD; i++) {
        const br = 0.4 + Math.random() * 0.6;
        cColArr[i*3]   = newCol[0] * br;
        cColArr[i*3+1] = newCol[1] * br;
        cColArr[i*3+2] = newCol[2] * br;
      }
      cloud.geometry.attributes.color.needsUpdate = true;
    }
  }

  renderer.render(scene, camera);
}
loop();
</script>
