<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>Interstellar Journey</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;top:0;left:0;right:0;bottom:0;}
    canvas{position:fixed;top:0;left:0;width:100%!important;height:100%!important;display:block;}

    /* ── Intro screen ── */
    #ui{
      position:fixed;inset:0;z-index:20;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at center, #030810 0%, #000 70%);
      transition:opacity 1.5s ease;
    }
    #ui.gone{opacity:0;pointer-events:none}

    .title{font-size:clamp(1.2rem,4vw,2.4rem);font-weight:100;letter-spacing:.6em;color:#7aabdd;text-transform:uppercase;margin-bottom:6px;text-align:center}
    .subtitle{font-size:.6rem;color:#1a2a3a;letter-spacing:.4em;margin-bottom:56px;text-align:center;text-transform:uppercase}

    #startBtn{
      width:130px;height:130px;border-radius:50%;
      border:1px solid #1a3050;background:none;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
      color:#4a7aaa;font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;
      position:relative;-webkit-appearance:none;
      transition:border-color .3s;
    }
    #startBtn::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid #0a1525;animation:pr 3s ease-out infinite;}
    #startBtn::before{content:'';position:absolute;inset:-22px;border-radius:50%;border:1px solid #050c18;animation:pr 3s ease-out infinite .8s;}
    @keyframes pr{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
    #startBtn svg{width:30px;height:30px;fill:#4a7aaa;stroke:none}
    #startBtn:active{border-color:#4a7aaa;background:rgba(74,122,170,.08)}

    #loadWrap{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:32px;}
    #loadWrap.show{display:flex}
    #loadBar{width:220px;height:1px;background:#0a1020;position:relative;}
    #loadFill{position:absolute;top:0;left:0;height:100%;background:#4a7aaa;width:0%;transition:width .25s;}
    #loadTxt{font-size:.62rem;color:#1a2a3a;letter-spacing:.15em}

    /* ── HUD — fades out after 3s of inactivity ── */
    #hud{
      position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));
      left:50%;transform:translateX(-50%);z-index:30;
      display:flex;align-items:center;gap:16px;
      background:rgba(0,5,15,.7);border:1px solid #0a1a2a;border-radius:50px;
      padding:10px 24px;
      transition:opacity .6s;
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      white-space:nowrap;opacity:0;pointer-events:none;
    }
    #hud.visible{opacity:1;pointer-events:all}
    #hud button{background:none;border:none;color:#4a7aaa;font-size:1.2rem;cursor:pointer;padding:4px 8px;min-width:44px;min-height:44px;-webkit-appearance:none}
    #tname{font-size:.68rem;color:#1a2a3a;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Touch hint */
    #hint{
      position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));left:50%;transform:translateX(-50%);
      z-index:28;font-size:.6rem;color:#0a1525;letter-spacing:.2em;text-transform:uppercase;
      opacity:0;transition:opacity 1s;pointer-events:none;white-space:nowrap;
    }
    #hint.show{opacity:1}
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="title">Interstellar</div>
  <div class="subtitle">Journey Through Space</div>
  <button id="startBtn">
    <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    Iniciar
  </button>
  <div id="loadWrap">
    <div id="loadBar"><div id="loadFill"></div></div>
    <div id="loadTxt">Preparando…</div>
  </div>
</div>

<div id="hud">
  <button id="pauseBtn" title="Pausa">⏸</button>
  <span id="tname">Interstellar</span>
  <button id="stopBtn" title="Detener">⏹</button>
</div>

<div id="hint">toca para ver controles</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ══════════════════════════════════════════════
// RENDERER
// ══════════════════════════════════════════════
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x00000a);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.01, 500);
scene.fog = new THREE.Fog(0x00000a, 60, 200);

function onResize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=>setTimeout(onResize, 350));

// ══════════════════════════════════════════════
// STAR STREAKS — the key warp effect
// Each star has a start/end position to draw a line (as two points)
// giving the hyperspace "streak" look
// ══════════════════════════════════════════════
const STREAK_COUNT = 3000;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(STREAK_COUNT * 2 * 3); // 2 verts per streak
const sCol = new Float32Array(STREAK_COUNT * 2 * 3);

function randStar(i, camZ) {
  const angle  = Math.random() * Math.PI * 2;
  // Bias toward outer ring for tunnel wall feel
  const rnd    = Math.random();
  const radius = 4 + rnd * rnd * 26; // more density at mid-range
  const depth  = camZ - 10 - Math.random() * 180;
  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  const base = i * 6;
  // Tail (dimmer, further back)
  sPos[base]   = x; sPos[base+1] = y; sPos[base+2] = depth - 0.5;
  // Head (brighter, closer)
  sPos[base+3] = x; sPos[base+4] = y; sPos[base+5] = depth;

  // Color: mostly white-blue, some gold
  const warm = Math.random() < 0.12;
  const bright = 0.5 + Math.random()*0.5;
  if (warm) {
    sCol[base]=bright;sCol[base+1]=bright*.7;sCol[base+2]=bright*.2;
    sCol[base+3]=1;sCol[base+4]=.85;sCol[base+5]=.4;
  } else {
    sCol[base]=bright*.6;sCol[base+1]=bright*.75;sCol[base+2]=bright;
    sCol[base+3]=.9;sCol[base+4]=.95;sCol[base+5]=1;
  }
}

for (let i=0; i<STREAK_COUNT; i++) randStar(i, 0);
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
sGeo.setAttribute('color',    new THREE.BufferAttribute(sCol,3));

const sMat = new THREE.LineSegments(
  sGeo,
  new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.95, blending:THREE.AdditiveBlending, depthWrite:false})
);
scene.add(sMat);

// ── Background star field (static dots, depth effect) ──
const BG_COUNT = 2500;
const bgGeo = new THREE.BufferGeometry();
const bgPos = new Float32Array(BG_COUNT*3);
const bgCol = new Float32Array(BG_COUNT*3);
for (let i=0; i<BG_COUNT; i++) {
  const a=Math.random()*Math.PI*2, r=1+Math.random()*28;
  bgPos[i*3]=Math.cos(a)*r; bgPos[i*3+1]=Math.sin(a)*r;
  bgPos[i*3+2]=-Math.random()*200;
  const b=.3+Math.random()*.7;
  bgCol[i*3]=b*.7; bgCol[i*3+1]=b*.8; bgCol[i*3+2]=b;
}
bgGeo.setAttribute('position',new THREE.BufferAttribute(bgPos,3));
bgGeo.setAttribute('color',   new THREE.BufferAttribute(bgCol,3));
const bgMat = new THREE.PointsMaterial({size:.08,vertexColors:true,transparent:true,opacity:.7,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(bgGeo,bgMat));

// ── Nebula clouds ──────────────────────────────
const NEB_COUNT = 800;
const nGeo = new THREE.BufferGeometry();
const nPos = new Float32Array(NEB_COUNT*3);
const nCol = new Float32Array(NEB_COUNT*3);
const nebPalette=[[.15,.35,.9],[.45,.1,.75],[.1,.55,.5],[.7,.15,.25],[.05,.25,.75]];
for(let i=0;i<NEB_COUNT;i++){
  const a=Math.random()*Math.PI*2,r=3+Math.random()*20;
  nPos[i*3]=Math.cos(a)*r;nPos[i*3+1]=Math.sin(a)*r;nPos[i*3+2]=-Math.random()*180;
  const c=nebPalette[Math.floor(Math.random()*nebPalette.length)];
  nCol[i*3]=c[0];nCol[i*3+1]=c[1];nCol[i*3+2]=c[2];
}
nGeo.setAttribute('position',new THREE.BufferAttribute(nPos,3));
nGeo.setAttribute('color',   new THREE.BufferAttribute(nCol,3));
const nMat=new THREE.PointsMaterial({size:4,vertexColors:true,transparent:true,opacity:.05,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(nGeo,nMat));

// ── Tunnel rings ──────────────────────────────
const rings=[];
for(let i=0;i<24;i++) spawnRing(-i*12-8);
function spawnRing(z){
  const segs=120,geo=new THREE.BufferGeometry();
  const pos=new Float32Array(segs*2*3); // line segments
  for(let i=0;i<segs;i++){
    const a1=(i/segs)*Math.PI*2, a2=((i+1)/segs)*Math.PI*2;
    const r=28;
    pos[i*6]  =Math.cos(a1)*r;pos[i*6+1]=Math.sin(a1)*r;pos[i*6+2]=0;
    pos[i*6+3]=Math.cos(a2)*r;pos[i*6+4]=Math.sin(a2)*r;pos[i*6+5]=0;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(Math.random(),.9,.6),transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthWrite:false});
  const ring=new THREE.LineSegments(geo,mat);
  ring.position.z=z;
  scene.add(ring);rings.push(ring);
}

// ══════════════════════════════════════════════
// AUDIO
// ══════════════════════════════════════════════
const AUDIO_URL='https://raw.githubusercontent.com/PyCHile/Music_pulse/main/music.mp3';
let actx=null,analyser=null,freq=null,srcNode=null,audioBuf=null;
let playing=false,paused=false,pauseAt=0,startAt=0,windGain=null;

const loadWrap=document.getElementById('loadWrap');
const loadFill=document.getElementById('loadFill');
const loadTxt =document.getElementById('loadTxt');
function setLoad(p,t){loadFill.style.width=p+'%';loadTxt.textContent=t;}

document.getElementById('startBtn').addEventListener('click', async function(){
  // Request fullscreen
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(req) req.call(el).catch(()=>{});

  this.style.display='none';
  loadWrap.classList.add('show');
  setLoad(5,'Iniciando…');

  try{
    actx=new(window.AudioContext||window.webkitAudioContext)();
    await actx.resume();
  }catch(e){setLoad(0,'Error audio: '+e.message);return;}

  setLoad(10,'Descargando…');
  try{
    const resp=await fetch(AUDIO_URL);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const total=+resp.headers.get('Content-Length')||0;
    const rdr=resp.body.getReader();
    const chunks=[];let received=0;
    while(true){
      const{done,value}=await rdr.read();
      if(done)break;
      chunks.push(value);received+=value.length;
      if(total)setLoad(10+(received/total)*70,`${Math.round(received/1024/1024)}MB…`);
    }
    setLoad(82,'Decodificando…');
    audioBuf=await actx.decodeAudioData(await new Blob(chunks).arrayBuffer());
    setLoad(100,'¡Despegando!');
    setTimeout(launch,500);
  }catch(e){setLoad(0,'Error: '+e.message);console.error(e);}
});

function createWind(){
  if(!actx)return;
  windGain=actx.createGain();windGain.gain.value=0;
  const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=.35;
  windGain.connect(f);f.connect(actx.destination);
  [160,300,520,850,1350].forEach(fr=>{
    const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=fr+Math.random()*50;
    const g=actx.createGain();g.gain.value=.01+Math.random()*.007;
    o.connect(g);g.connect(windGain);o.start();
  });
}

function triggerWind(v){
  if(!windGain)return;
  const n=actx.currentTime;
  windGain.gain.cancelScheduledValues(n);
  windGain.gain.setValueAtTime(windGain.gain.value,n);
  windGain.gain.linearRampToValueAtTime(v*.25,n+.07);
  windGain.gain.exponentialRampToValueAtTime(.001,n+1.5);
}

function setupNodes(){
  if(srcNode){try{srcNode.stop();}catch(_){}}
  analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.8;
  freq=new Uint8Array(analyser.frequencyBinCount);
  srcNode=actx.createBufferSource();srcNode.buffer=audioBuf;
  srcNode.connect(analyser);analyser.connect(actx.destination);
  createWind();
}

function startSrc(offset){
  srcNode.start(0,offset);startAt=actx.currentTime-offset;
  playing=true;paused=false;
  srcNode.onended=()=>{if(!paused)playing=false;};
}

function launch(){
  setupNodes();
  actx.resume().then(()=>{startSrc(0);showJourney();});
}

function showJourney(){
  document.getElementById('ui').classList.add('gone');
  showHudBriefly();
  setTimeout(()=>{document.getElementById('hint').classList.add('show');},3000);
}

// ── HUD auto-hide ──────────────────────────────
let hudTimer=null;
function showHudBriefly(){
  const hud=document.getElementById('hud');
  hud.classList.add('visible');
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>{
    hud.classList.remove('visible');
    document.getElementById('hint').classList.add('show');
  },3500);
}

// Touch: tap = show hud, hold = steer
let touching=false,holdTimer=null;
let dragYaw=0,dragPitch=0,dragLx=0,dragLy=0,isDragging=false;

document.addEventListener('touchstart',e=>{
  if(document.getElementById('ui').classList.contains('gone')===false) return;
  touching=true;
  dragLx=e.touches[0].clientX; dragLy=e.touches[0].clientY;
  isDragging=false;
  holdTimer=setTimeout(()=>{isDragging=true;},{150});
  showHudBriefly();
  document.getElementById('hint').classList.remove('show');
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(!touching) return;
  const dx=e.touches[0].clientX-dragLx;
  const dy=e.touches[0].clientY-dragLy;
  if(Math.abs(dx)>8||Math.abs(dy)>8) isDragging=true;
  if(isDragging){
    targetYaw  +=dx*.003;
    targetPitch+=dy*.002;
    dragLx=e.touches[0].clientX; dragLy=e.touches[0].clientY;
  }
},{passive:true});

document.addEventListener('touchend',()=>{touching=false;clearTimeout(holdTimer);},{passive:true});

// Mouse for desktop
document.addEventListener('mousemove',e=>{
  targetYaw  =(e.clientX/innerWidth -.5)*.5;
  targetPitch=(e.clientY/innerHeight-.5)*.25;
});

document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!actx||!srcNode)return;
  if(paused){
    setupNodes();actx.resume().then(()=>{startSrc(pauseAt);document.getElementById('pauseBtn').textContent='⏸';});
  }else{
    pauseAt=actx.currentTime-startAt;
    try{srcNode.stop();}catch(_){}
    playing=false;paused=true;document.getElementById('pauseBtn').textContent='▶';
  }
});

document.getElementById('stopBtn').addEventListener('click',()=>{
  if(srcNode){try{srcNode.stop();}catch(_){}srcNode=null;}
  if(actx){try{actx.close();}catch(_){}actx=null;}
  playing=false;paused=false;analyser=null;windGain=null;
  document.getElementById('hud').classList.remove('visible');
  document.getElementById('hint').classList.remove('show');
  document.getElementById('ui').classList.remove('gone');
  document.getElementById('startBtn').style.display='';
  loadWrap.classList.remove('show');
  const exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(exit) exit.call(document).catch(()=>{});
});

// ══════════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════════
let t=0, camYaw=0, camPitch=0, targetYaw=0, targetPitch=0;
let lastBass=0, lastMid=0, turnTimer=0, turnInterval=5+Math.random()*4;
let windTriggered=false, ringColorTimer=0;

const MAX_YAW=.4, MAX_PITCH=.22;
let prevTime=performance.now();

function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(), dt=Math.min((now-prevTime)/1000,.05);
  prevTime=now; t+=dt;

  // ── Audio ─────────────────────────────────
  let bass=0,mid=0,hi=0,energy=0;
  if(analyser&&playing){
    analyser.getByteFrequencyData(freq);
    const L=freq.length;
    for(let i=0;i<L*.05;i++)   bass+=freq[i]; bass/=(L*.05*255);
    for(let i=L*.05|0;i<L*.25;i++) mid+=freq[i];  mid/=(L*.20*255);
    for(let i=L*.25|0;i<L*.70;i++) hi+=freq[i];   hi/=(L*.45*255);
    energy=bass*.6+mid*.3+hi*.1;
  }
  const sBass=lastBass+(bass-lastBass)*.14;
  const sMid =lastMid +(mid -lastMid )*.10;
  lastBass=sBass; lastMid=sMid;

  // ── Speed: energy drives warp ─────────────
  // At rest: 12 u/s. On peak bass: up to 70 u/s
  const warpSpeed = (12 + sBass*45 + sMid*15) * dt;

  // ── Auto steering ─────────────────────────
  turnTimer+=dt;
  if(turnTimer>turnInterval){
    turnTimer=0; turnInterval=4+Math.random()*5;
    targetYaw  +=(Math.random()-.5)*.38;
    targetPitch+=(Math.random()-.5)*.18;
    if(actx&&playing) triggerWind(.6+energy*.4);
  }
  targetYaw  =Math.max(-MAX_YAW,   Math.min(MAX_YAW,   targetYaw));
  targetPitch=Math.max(-MAX_PITCH, Math.min(MAX_PITCH, targetPitch));

  if(sBass>.62&&!windTriggered&&actx&&playing){triggerWind(sBass*.45);windTriggered=true;}
  if(sBass<.35) windTriggered=false;

  camYaw  +=(targetYaw  -camYaw)  *2.5*dt;
  camPitch+=(targetPitch-camPitch)*2.5*dt;

  camera.rotation.order='YXZ';
  camera.rotation.y=camYaw  +Math.sin(t*.25)*.018;
  camera.rotation.x=camPitch+Math.sin(t*.18)*.012;
  camera.rotation.z=Math.sin(t*.12)*.015+sBass*.025;

  const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  camera.position.addScaledVector(dir, warpSpeed);

  // Keep camera near center
  const cr=Math.sqrt(camera.position.x**2+camera.position.y**2);
  if(cr>8){camera.position.x*=8/cr;camera.position.y*=8/cr;}

  const camZ=camera.position.z;

  // ── Update star streaks ────────────────────
  // Streak length grows with speed (warp effect)
  const streakLen = .5 + warpSpeed*8 + sBass*4;
  const posA=sGeo.attributes.position;
  const colA=sGeo.attributes.color;
  for(let i=0;i<STREAK_COUNT;i++){
    const b=i*6;
    let z=posA.array[b+5]; // head Z

    // If streak has passed camera, respawn ahead
    if(z>camZ+2){
      const angle=Math.random()*Math.PI*2;
      const rnd=Math.random(), radius=4+rnd*rnd*24;
      const newZ=camZ-15-Math.random()*160;
      const x=Math.cos(angle)*radius+camera.position.x;
      const y=Math.sin(angle)*radius+camera.position.y;
      // tail
      posA.array[b]  =x;posA.array[b+1]=y;posA.array[b+2]=newZ-streakLen;
      // head
      posA.array[b+3]=x;posA.array[b+4]=y;posA.array[b+5]=newZ;

      // Color tint from energy
      const warm=Math.random()<.12, bright=.5+Math.random()*.5;
      if(warm){colA.array[b]=bright;colA.array[b+1]=bright*.65;colA.array[b+2]=bright*.15;colA.array[b+3]=1;colA.array[b+4]=.85;colA.array[b+5]=.35;}
      else{
        const rb=.5+sMid*.3, gb=.75+hi*.2;
        colA.array[b]=bright*rb;colA.array[b+1]=bright*gb;colA.array[b+2]=bright;
        colA.array[b+3]=rb;colA.array[b+4]=gb;colA.array[b+5]=1;
      }
    } else {
      // Stretch tail backward based on speed
      posA.array[b+2]=posA.array[b+5]-streakLen;
    }
    // Dim tail, bright head
    colA.array[b]  *=.4;colA.array[b+1]*=.4;colA.array[b+2]*=.4;
  }
  posA.needsUpdate=true; colA.needsUpdate=true;

  // ── Background stars ──────────────────────
  const bpa=bgGeo.attributes.position;
  for(let i=0;i<BG_COUNT;i++){
    if(bpa.array[i*3+2]>camZ+5){
      const a=Math.random()*Math.PI*2,r=2+Math.random()*28;
      bpa.array[i*3]=camera.position.x+Math.cos(a)*r;
      bpa.array[i*3+1]=camera.position.y+Math.sin(a)*r;
      bpa.array[i*3+2]=camZ-20-Math.random()*180;
    }
  }
  bpa.needsUpdate=true;
  bgMat.opacity=.5+sMid*.3;

  // ── Nebula ───────────────────────────────
  const npa=nGeo.attributes.position;
  for(let i=0;i<NEB_COUNT;i++){
    if(npa.array[i*3+2]>camZ+12){
      const a=Math.random()*Math.PI*2,r=3+Math.random()*22;
      npa.array[i*3]=camera.position.x+Math.cos(a)*r;
      npa.array[i*3+1]=camera.position.y+Math.sin(a)*r;
      npa.array[i*3+2]=camZ-20-Math.random()*160;
    }
  }
  npa.needsUpdate=true;
  nMat.opacity=.03+sMid*.1+hi*.07;
  nMat.size=3.5+energy*5;

  // ── Rings ────────────────────────────────
  for(const r of rings){
    r.position.z+=warpSpeed*3;
    const rs=1+sBass*.3;r.scale.set(rs,rs,1);
    r.material.opacity=.1+sMid*.35;
    r.rotation.z+=dt*.2+sBass*.3*dt;
    if(r.position.z>camZ+8){
      r.position.z=camZ-260-Math.random()*20;
      r.material.color.setHSL(Math.random(),.9,.55+energy*.25);
    }
  }
  ringColorTimer+=dt;
  if(sBass>.58&&ringColorTimer>.25){
    ringColorTimer=0;
    for(const r of rings)r.material.color.setHSL(Math.random(),1,.75);
  }

  // ── Global ───────────────────────────────
  // FOV: wider at high speed = warp sensation
  camera.fov=88+warpSpeed*1.2+sBass*8;
  camera.fov=Math.max(70,Math.min(118,camera.fov));
  camera.updateProjectionMatrix();

  // Fog: thicker in quiet moments, thinner in peaks
  scene.fog.near=40+energy*20;
  scene.fog.far=150+energy*80;

  renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
