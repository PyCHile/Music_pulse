name: Interstellar Warp QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Repository structure audit
        run: |
          find . -maxdepth 4 -type f | sort | grep -v node_modules
          test -f package.json
          test -f vite.config.ts
          test -f tsconfig.json
          test -f index.html
          test -f manifest-urux.json
          test -f llms.txt
          test -f AGENTS.md
          test -f sitemap.xml
          test -f sitemap.md
          test -f robots.txt
          test -f src/main.tsx
          test -f src/App.tsx
          test -f src/JourneyAgent.ts
          test -f src/ModelResolver.ts
          test -f src/NarrativeStateMachine.ts
          test -f src/EncounterPlanner.ts
          test -f src/FocalTrajectoryEngine.ts
          test -f src/CosmicPaletteDirector.ts
          test -f src/audio/AudioEngine.ts
          test -f src/audio/AudioReactiveEngine.ts
          test -f src/audio/MusicalStateAnalyzer.ts
          test -f src/warp/WarpContinuityDirector.ts
          test -f src/warp/VisualFamilyLock.ts
          test -f src/warp/ContinuityGuard.ts
          test -f src/warp/StarTunnelSystem.ts
          test -f src/warp/OpticalFlowController.ts
          test -f src/warp/StreakController.ts
          test -f src/performance/AdaptiveQualityManager.ts
          test -f runtime/main.js
          test -f runtime/journey/URUXJourneyAgent.js
          test -f runtime/journey/CinematicEncounterSystem.js
          test -f runtime/journey/NebulaDirectiveBridge.js
          test -f runtime/spacekit/SpaceKitAstronomicalLayer.js
          grep -q 'URUXJourneyAgent' runtime/main.js
          grep -q 'semanticJourneyStage' runtime/main.js
          grep -q 'spawnEncounter(encounter,meta)' runtime/main.js
          grep -q 'llmEncounterRendered' runtime/main.js
          grep -q 'NebulaDirectiveBridge' runtime/main.js
          grep -q 'llmNebulaApplied' runtime/main.js
          grep -q 'journeySynchronized' runtime/main.js
          grep -q 'synchronizeWithLegacyStage' runtime/main.js
          grep -q 'LEGACY_TO_SEMANTIC' runtime/journey/URUXJourneyAgent.js
          grep -q 'IDEALIZED_COSMOS' runtime/journey/URUXJourneyAgent.js
          grep -q 'syncTo(stageId)' runtime/journey/URUXJourneyAgent.js
          grep -q 'clearBuffer()' runtime/journey/URUXJourneyAgent.js
          grep -q 'encounterSink' runtime/journey/URUXJourneyAgent.js
          grep -q "source:'llm'" runtime/journey/URUXJourneyAgent.js
          grep -q 'darkZoneFraction' runtime/journey/URUXJourneyAgent.js
          grep -q 'llmSpawned' runtime/journey/CinematicEncounterSystem.js
          grep -q 'trajectoryVector' runtime/journey/CinematicEncounterSystem.js
          grep -q 'uNarrativeDarkZone' runtime/warp/NebulaBackdrop.js
          grep -q 'uNarrativeFilaments' runtime/warp/NebulaBackdrop.js
          grep -q 'uNarrativeCore' runtime/warp/NebulaBackdrop.js
          test -f tests/e2e/runtime-warp-continuity.spec.ts
          test -f tests/e2e/spacekit-astronomical-layer.spec.ts
      - name: Reject deprecated URUX files
        run: |
          test ! -e runtime/warp/EtherealFiguresSystem.js
          test ! -e src/warp/EtherealFiguresSystem.ts
          test ! -e assets/ethereal
          test ! -e runtime/warp/CelestialFlybySystem.js
          test ! -e src/warp/CelestialFlybySystem.ts
          test ! -e runtime/space/ColorScience.js
          test ! -e src/space/ColorScience.ts
          test ! -e src/spacekit
          test ! -e manifest.json
          test ! -e src/shaders/commonNoise.glsl
          test ! -e src/shaders/hazeFragment.glsl
          test ! -e assets/truecolor/Jupiter_Li2018_visible.txt
          test ! -e assets/truecolor/Mars_McCord1971_visible.txt
          if grep -q '@react-three/drei' package.json; then
            echo 'Unused Drei dependency reintroduced'; exit 1
          fi
      - name: Reject placeholders in critical source
        run: |
          if grep -RniE 'TODO|placeholder|mock-only|fake shader' src runtime --include='*.ts' --include='*.tsx' --include='*.js' --include='*.glsl'; then
            echo 'Critical placeholder marker detected'; exit 1
          fi
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and warp checkpoint tests
        run: npm run test:e2e
      - name: Validate production artifacts
        run: |
          test -d dist
          find dist -maxdepth 4 -type f | sort
      - name: Upload visual QA checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warp-visual-checkpoints
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
