name: Interstellar Warp QA v54
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Production architecture-preserved audit
        run: |
          for f in index.html version.json runtime/main.js runtime/mainCoreV53.js runtime/scene/InterstellarWarpSceneV53.js runtime/warp/WarpFieldManagerV53.js runtime/warp/CachedVolumetricNebulaPassV53.js runtime/warp/VolumetricNebulaRaymarcherV53.js runtime/warp/DeepSpaceSectorSystemV53.js runtime/warp/CloudNebulaLayerV53.js runtime/warp/GalacticWispSystemV53.js runtime/performance/LayerBudgetSchedulerV53.js runtime/audio/AudioEngineV53.js runtime/journey/CinematicEncounterSystemV53.js runtime/particles/ThreeNebulaParticleFXV53.js runtime/journey/SecureURUXJourneyAgent.js runtime/journey/URUXBackendClient.js worker/src/index-v2.js; do test -f "$f"; done
          grep -q 'mainCoreV53' runtime/main.js
          grep -q 'InterstellarWarpSceneV53' runtime/mainCoreV53.js
          grep -q 'desktop-layer-budget' runtime/mainCoreV53.js
          grep -q 'mobile-layer-budget' runtime/mainCoreV53.js
          grep -q 'ARCHITECTURE-PRESERVED' version.json
          grep -q 'CachedVolumetricNebulaPass' runtime/scene/InterstellarWarpSceneV53.js
          grep -q '230000' runtime/warp/CachedVolumetricNebulaPassV53.js
          grep -q 'refreshHz' runtime/warp/CachedVolumetricNebulaPassV53.js
          grep -q 'VolumetricNebulaRaymarcherV53' runtime/warp/CachedVolumetricNebulaPassV53.js
          grep -q 'LayerBudgetScheduler' runtime/warp/WarpFieldManagerV53.js
          grep -q 'DeepSpaceSectorSystemV53' runtime/warp/WarpFieldManagerV53.js
          ! grep -q 'extends Base' runtime/warp/DeepSpaceSectorSystemV53.js
          grep -q "import('three-nebula')" runtime/particles/ThreeNebulaParticleFXV53.js
          grep -q "mode:'event-driven'" runtime/particles/ThreeNebulaParticleFXV53.js
          grep -q 'CinematicEncounterSystemV53' runtime/journey/CinematicSelectorV51.js
          ! grep -q 'typpo.github.io/spacekit/build/spacekit.js' index.html
          grep -q "mode:'static-precomputed'" runtime/astronomy/ScientificAstronomyRuntime.js
      - name: Scientific LAB audit
        run: |
          grep -q 'CelestiaCore::initSimulation' scientific/celestia/simulation_probe.cpp
          grep -q 'WCSAxes' science/build_astronomy_assets.py
          grep -q 'SpectralCube' science/build_astronomy_assets.py
          grep -q 'astroquery.eso' science/augment_astronomy_assets.py
          grep -q 'nativeBuildVerified' runtime/astronomy/ScientificAstronomyRuntimeLab.js
      - name: Security audit
        run: |
          grep -q '/v1/encounters' runtime/journey/URUXBackendClient.js
          grep -q 'OPENROUTER_API_KEY' worker/src/index-v2.js
          ! grep -R -E 'Authorization\s*:\s*.*Bearer|openrouter\.ai/api/v1/chat/completions' runtime
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node --check worker/src/index-v2.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warp-visual-checkpoints-v54
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
