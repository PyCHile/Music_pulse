name: Interstellar Warp QA v55
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Production nebula-crossing audit
        run: |
          for f in index.html version.json runtime/main.js runtime/mainCoreV53.js runtime/scene/InterstellarWarpSceneV53.js runtime/warp/WarpFieldManagerV53.js runtime/warp/CloudNebulaLayerV55.js runtime/warp/CachedVolumetricNebulaPassV53.js runtime/warp/VolumetricNebulaRaymarcherV53.js runtime/warp/DeepSpaceSectorSystemV53.js runtime/warp/GalacticWispSystemV53.js runtime/performance/LayerBudgetSchedulerV53.js runtime/audio/AudioEngineV53.js runtime/journey/CinematicEncounterSystemV55.js runtime/journey/CinematicEncounterSystemV53.js runtime/particles/ThreeNebulaParticleFXV53.js runtime/journey/SecureURUXJourneyAgent.js runtime/journey/URUXBackendClient.js worker/src/index-v2.js; do test -f "$f"; done
          grep -q 'NEBULA-CROSSING-REAL-COMET' version.json
          grep -q 'CloudNebulaLayerV55' runtime/warp/WarpFieldManagerV53.js
          grep -q "mode:'continuous-traversal'" runtime/warp/CloudNebulaLayerV55.js
          grep -q 'crossings' runtime/warp/CloudNebulaLayerV55.js
          grep -q 'sprite.position.z+=speed' runtime/warp/CloudNebulaLayerV55.js
          grep -q 'CinematicEncounterSystemV55' runtime/journey/CinematicSelectorV51.js
          grep -q 'morfología bilobulada tipo 67P' runtime/journey/CinematicEncounterSystemV55.js
          grep -q 'comet-67p.jpg' runtime/journey/CinematicEncounterSystemV55.js
          grep -q 'redThermalShell:false' runtime/journey/CinematicEncounterSystemV55.js
          ! grep -q '0xff6a18' runtime/journey/CinematicEncounterSystemV55.js
          grep -q 'overtakePasses' runtime/journey/CinematicEncounterSystemV55.js
          grep -q "import('three-nebula')" runtime/particles/ThreeNebulaParticleFXV53.js
          grep -q "mode:'event-driven'" runtime/particles/ThreeNebulaParticleFXV53.js
          grep -q 'CachedVolumetricNebulaPass' runtime/scene/InterstellarWarpSceneV53.js
          grep -q '230000' runtime/warp/CachedVolumetricNebulaPassV53.js
          ! grep -q 'typpo.github.io/spacekit/build/spacekit.js' index.html
      - name: Scientific LAB audit
        run: |
          grep -q 'CelestiaCore::initSimulation' scientific/celestia/simulation_probe.cpp
          grep -q 'WCSAxes' science/build_astronomy_assets.py
          grep -q 'SpectralCube' science/build_astronomy_assets.py
          grep -q 'astroquery.eso' science/augment_astronomy_assets.py
          grep -q 'nativeBuildVerified' runtime/astronomy/ScientificAstronomyRuntimeLab.js
      - name: Security audit
        run: |
          grep -q '/v1/encounters' runtime/journey/URUXBackendClient.js
          grep -q 'OPENROUTER_API_KEY' worker/src/index-v2.js
          ! grep -R -E 'Authorization\s*:\s*.*Bearer|openrouter\.ai/api/v1/chat/completions' runtime
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node --check worker/src/index-v2.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warp-visual-checkpoints-v55
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
