name: Interstellar Warp QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install

      - name: Repository structure audit
        run: |
          for f in \
            package.json vite.config.ts tsconfig.json index.html version.json \
            runtime/main.js runtime/capabilities/RuntimeCapabilityRegistry.js \
            runtime/journey/SecureURUXJourneyAgent.js runtime/journey/URUXBackendClient.js \
            runtime/journey/CinematicEncounterSystem.js runtime/journey/CinematicEncounterSystemV42.js \
            runtime/journey/NebulaDirectiveBridge.js runtime/particles/ThreeNebulaParticleFX.js \
            runtime/assets/AstronomicalTextureManager.js runtime/performance/WebGPUComputeEnhancer.js \
            runtime/warp/VolumetricNebulaRaymarcher.js runtime/warp/WarpFieldManager.js \
            runtime/astronomy/ScientificAstronomyRuntime.js worker/src/index-v2.js worker/src/windmill.js \
            worker/wrangler.jsonc; do test -f "$f"; done
          grep -q 'SecureURUXJourneyAgent' runtime/main.js
          grep -q 'configureBackendURL' runtime/main.js
          grep -q 'llmActive' runtime/main.js
          grep -q '/v1/encounters' runtime/journey/URUXBackendClient.js
          grep -q 'capabilities:this.lastCapabilities' runtime/journey/URUXBackendClient.js
          grep -q 'OPENROUTER_API_KEY' worker/src/index-v2.js
          grep -q 'structured_outputs' worker/src/index-v2.js
          grep -q 'response_format' worker/src/index-v2.js
          grep -q 'KNOWN_CAPABILITIES' worker/src/index-v2.js

      - name: Volumetric nebula architecture audit
        run: |
          FILE=runtime/warp/VolumetricNebulaRaymarcher.js
          for symbol in densityField simplex3 worley3 fbm psrdPeriodic uExtinction uScattering uEmission 'float hg' shadowTransmittance uShadowSteps uShadowStrength uNarrativeDarkZone uNarrativeFilaments this.avgDt; do grep -q "$symbol" "$FILE"; done
          grep -q 'trans\*=1.0-alpha' "$FILE"
          grep -q 'selfShadowing:true' "$FILE"
          grep -q 'VolumetricNebulaRaymarcher' runtime/warp/WarpFieldManager.js
          if grep -q 'uVisibility.value=Math.min(.085' runtime/warp/WarpFieldManager.js; then echo 'Legacy low-visibility flat-nebula clamp reintroduced'; exit 1; fi

      - name: Particle, PBR and postprocessing audit
        run: |
          grep -q "import('three-nebula')" runtime/particles/ThreeNebulaParticleFX.js
          grep -q 'SpriteRenderer' runtime/particles/ThreeNebulaParticleFX.js
          grep -q "type==='comet'" runtime/particles/ThreeNebulaParticleFX.js
          grep -q "type==='debris'" runtime/particles/ThreeNebulaParticleFX.js
          grep -q "from 'postprocessing'" runtime/scene/InterstellarWarpScene.js
          grep -q 'BloomEffect' runtime/scene/InterstellarWarpScene.js
          for symbol in KTX2Loader earth_night_4096 earth_bump_roughness_clouds_4096 roughnessMap bumpMap emissiveMap; do grep -q "$symbol" runtime/assets/AstronomicalTextureManager.js; done

      - name: WebGPU progressive enhancement audit
        run: |
          for symbol in requestAdapter createComputePipeline dispatchWorkgroups MAP_READ applyToRaymarcher; do grep -q "$symbol" runtime/performance/WebGPUComputeEnhancer.js; done
          grep -q "runtimeCapabilities.mark('webgpu-compute',true" runtime/performance/WebGPUComputeEnhancer.js

      - name: Scientific stack and static Celestia audit
        run: |
          for pkg in astropy astroquery aplpy reproject matplotlib numpy spectral-cube; do grep -qi "$pkg" requirements-astro.txt; done
          for f in science/build_astronomy_assets.py science/augment_astronomy_assets.py science/export_celestia_static_runtime.py native/celestia/build.sh scientific/celestia/sidecar/server.cpp windmill/f/urux/validate_encounter.ts windmill/f/urux/direct_journey.ts; do test -f "$f"; done
          grep -q 'WCSAxes' science/build_astronomy_assets.py
          grep -q 'reproject_interp' science/build_astronomy_assets.py
          grep -q 'reproject_adaptive' science/build_astronomy_assets.py
          grep -q 'reproject_exact' science/build_astronomy_assets.py
          grep -q 'SpectralCube' science/build_astronomy_assets.py
          grep -q 'astroquery.eso' science/augment_astronomy_assets.py
          grep -q 'astroquery.nist' science/augment_astronomy_assets.py
          grep -q 'github-actions-static-precompute' native/celestia/build.sh

      - name: Encounter visibility and cost audit
        run: |
          grep -q "DESPRENDIMIENTO:\['comet'" runtime/journey/CinematicEncounterSystem.js
          grep -q 'SphereGeometry(2.35' runtime/journey/CinematicEncounterSystem.js
          grep -q 'z=-112' runtime/journey/CinematicEncounterSystem.js
          grep -q 'this.nextAt=2.5' runtime/journey/CinematicEncounterSystem.js
          grep -q 'maxActive=2' runtime/journey/CinematicEncounterSystem.js
          grep -q 'setTimeout(()=>resolve({done:false}),3000)' runtime/journey/SecureURUXJourneyAgent.js
          if grep -q 'AbortController' runtime/journey/SecureURUXJourneyAgent.js; then echo 'Journey agent must not abort LLM inference at the 3 second visual timeout'; exit 1; fi

      - name: Security boundary audit
        run: |
          test ! -e runtime/journey/URUXJourneyAgent.js
          python - <<'PY'
          import pathlib,re,sys
          frontend=[]
          for root in ('src','runtime'):
              for p in pathlib.Path(root).rglob('*'):
                  if p.suffix in {'.js','.ts','.tsx'}:
                      text=p.read_text(errors='ignore')
                      if re.search(r'urux_openrouter_api_key|Authorization\s*:\s*.*Bearer|openrouter\.ai/api/v1/(chat/completions|models)',text,re.I):
                          frontend.append(str(p))
          if frontend:
              print('Direct provider/credential handling detected in frontend:',frontend);sys.exit(1)
          hardcoded=[]
          for p in pathlib.Path('worker').rglob('*.js'):
              text=p.read_text(errors='ignore')
              if re.search(r'OPENROUTER_API_KEY\s*[:=]\s*[\'\"][^\'\"]+[\'\"]',text):hardcoded.append(str(p))
          if hardcoded:
              print('Possible hard-coded OpenRouter secret:',hardcoded);sys.exit(1)
          PY
          test ! -e worker/.dev.vars
          test ! -e worker/.env
          if grep -R -E 'requestAnimationFrame|renderer\.render|composer\.render' windmill/f/urux; then echo 'Windmill entered render loop'; exit 1; fi

      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Worker syntax check
        run: |
          node --check worker/src/index-v2.js
          node --check worker/src/windmill.js
          node --check worker/src/celestia-sidecar.js
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and warp checkpoint tests
        run: npm run test:e2e
      - name: Validate production artifacts
        run: test -d dist
      - name: Upload visual QA checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warp-visual-checkpoints
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
