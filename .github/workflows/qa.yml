name: Interstellar Warp QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Repository structure audit
        run: |
          find . -maxdepth 4 -type f | sort | grep -v node_modules
          test -f package.json
          test -f vite.config.ts
          test -f tsconfig.json
          test -f index.html
          test -f manifest-urux.json
          test -f llms.txt
          test -f AGENTS.md
          test -f sitemap.xml
          test -f sitemap.md
          test -f robots.txt
          test -f src/main.tsx
          test -f src/App.tsx
          test -f src/JourneyAgent.ts
          test -f src/ModelResolver.ts
          test -f src/NarrativeStateMachine.ts
          test -f src/EncounterPlanner.ts
          test -f src/FocalTrajectoryEngine.ts
          test -f src/CosmicPaletteDirector.ts
          test -f runtime/main.js
          test -f runtime/journey/SecureURUXJourneyAgent.js
          test -f runtime/journey/URUXBackendClient.js
          test -f runtime/journey/CinematicEncounterSystem.js
          test -f runtime/journey/NebulaDirectiveBridge.js
          test -f runtime/spacekit/SpaceKitAstronomicalLayer.js
          test -f worker/src/index.js
          test -f worker/wrangler.jsonc
          test -f worker/package.json
          grep -q 'SecureURUXJourneyAgent' runtime/main.js
          grep -q 'configureBackendURL' runtime/main.js
          grep -q 'secureBackendConfigured' runtime/main.js
          grep -q 'URUXBackendClient' runtime/journey/SecureURUXJourneyAgent.js
          grep -q '/v1/encounters' runtime/journey/URUXBackendClient.js
          grep -q 'OPENROUTER_API_KEY' worker/src/index.js
          grep -q 'OPENROUTER_API_KEY' worker/wrangler.jsonc
          grep -q 'darkZoneFraction' worker/src/index.js
          grep -q 'structured_outputs' worker/src/index.js
          grep -q 'response_format' worker/src/index.js
          grep -q 'llmEncounterRendered' runtime/main.js
          grep -q 'llmNebulaApplied' runtime/main.js
          grep -q 'journeySynchronized' runtime/main.js
          test -f tests/e2e/runtime-warp-continuity.spec.ts
          test -f tests/e2e/spacekit-astronomical-layer.spec.ts
      - name: Security boundary audit
        run: |
          test ! -e runtime/journey/URUXJourneyAgent.js
          if grep -RniE 'urux_openrouter_api_key|Authorization:.*Bearer|openrouter\.ai/api/v1/chat/completions|openrouter\.ai/api/v1/models' src runtime --include='*.ts' --include='*.tsx' --include='*.js'; then
            echo 'Direct OpenRouter access or provider credential handling detected in frontend code'; exit 1
          fi
          if grep -RniE 'OPENROUTER_API_KEY\s*[:=]\s*["'"'][^"'"']+' worker --exclude='wrangler.jsonc' --exclude='README.md'; then
            echo 'Possible hard-coded OpenRouter secret detected'; exit 1
          fi
          test ! -e worker/.dev.vars
          test ! -e worker/.env
      - name: Reject deprecated URUX files
        run: |
          test ! -e runtime/warp/EtherealFiguresSystem.js
          test ! -e src/warp/EtherealFiguresSystem.ts
          test ! -e assets/ethereal
          test ! -e runtime/warp/CelestialFlybySystem.js
          test ! -e src/warp/CelestialFlybySystem.ts
          test ! -e runtime/space/ColorScience.js
          test ! -e src/space/ColorScience.ts
          test ! -e src/spacekit
          test ! -e manifest.json
          if grep -q '@react-three/drei' package.json; then
            echo 'Unused Drei dependency reintroduced'; exit 1
          fi
      - name: Reject placeholders in critical source
        run: |
          if grep -RniE 'TODO|placeholder|mock-only|fake shader' src runtime worker/src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.glsl'; then
            echo 'Critical placeholder marker detected'; exit 1
          fi
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Worker syntax check
        run: node --check worker/src/index.js
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and warp checkpoint tests
        run: npm run test:e2e
      - name: Validate production artifacts
        run: |
          test -d dist
          find dist -maxdepth 4 -type f | sort
      - name: Upload visual QA checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warp-visual-checkpoints
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
