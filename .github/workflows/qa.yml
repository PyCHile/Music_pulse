name: Interstellar Warp QA v66
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Production cinematic-space audit
        run: |
          for f in index.html version.json runtime/main.js runtime/mainCoreV53.js runtime/scene/InterstellarWarpSceneV53.js runtime/warp/WarpFieldManagerV53.js runtime/warp/CloudNebulaVolumeV66.js runtime/warp/CloudNebulaVolumeV65.js runtime/warp/CachedVolumetricNebulaPassV53.js runtime/warp/VolumetricNebulaRaymarcherV66.js runtime/warp/VolumetricNebulaRaymarcherV65.js runtime/warp/DeepSpaceSectorSystemV53.js runtime/warp/GalacticWispSystemV53.js runtime/performance/LayerBudgetSchedulerV53.js runtime/audio/AudioEngineV53.js runtime/audio/MusicPulseDirectorV66.js runtime/journey/PhysicalEncounterRuntimeV66.js runtime/journey/SecureURUXJourneyAgent.js runtime/journey/URUXBackendClient.js worker/src/index-v2.js; do test -f "$f"; done
          grep -q 'URUX-20260815-66-' version.json
          grep -q 'id="enterBtn" disabled' index.html
          grep -q 'interactionReady' index.html
          grep -q '#controls\[hidden\]' index.html
          grep -q 'CloudNebulaVolumeV66' runtime/warp/WarpFieldManagerV53.js
          grep -q 'VolumetricNebulaRaymarcherV66' runtime/warp/CachedVolumetricNebulaPassV53.js
          grep -q "revision:'v66-music-crescendo-director'" runtime/audio/MusicPulseDirectorV66.js
          grep -q 'sectionFor' runtime/audio/MusicPulseDirectorV66.js
          grep -q 'allowCloseComet' runtime/audio/MusicPulseDirectorV66.js
          grep -q "perceptualRevision:'v66-directed-crescendo-gas'" runtime/warp/CloudNebulaVolumeV66.js
          grep -q 'whiteoutProtection:true' runtime/warp/CloudNebulaVolumeV66.js
          grep -q "perceptualRevision='v66-music-directed-raymarch'" runtime/warp/VolumetricNebulaRaymarcherV66.js
          grep -q 'PhysicalEncounterRuntimeV66.js?v=20260815-66.2' runtime/scene/InterstellarWarpSceneV53.js
          grep -q "revision:'v66.2-focal-organic-relative-motion'" runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q "id:'ocean-terra'" runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q 'organicFbmSurface:true' runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q 'atmosphereShell:true' runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q "motionModel:'shared-forward-speed-v66.2'" runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q 'focalConeDeg' runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q 'effectiveForwardSpeed' runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q "kinematics:'relative-velocity-aligned-v66'" runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q "guaranteedRouteMode:'overtake'" runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q 'legacyCinematicGraphActive:false' runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q 'visualRuntimeIndependentOfAI:true' runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q 'setFromUnitVectors' runtime/journey/PhysicalEncounterRuntimeV66.js
          grep -q 'effectiveForwardSpeed:this.state.speed' runtime/scene/InterstellarWarpSceneV53.js
          grep -q 'InterstellarWarpSceneV53.js?v=20260815-66.2' runtime/mainCoreV53.js
          grep -q 'PhysicalEncounterRuntimeV66.js?v=20260815-66.2' runtime/main.js
          grep -q 'uruxMusicDirection' runtime/scene/InterstellarWarpSceneV53.js
          grep -q 'nebulaDirectorScale' runtime/scene/InterstellarWarpSceneV53.js
          grep -q 'musicSpeedTarget' runtime/scene/InterstellarWarpSceneV53.js
          ! grep -q 'cinematicModulePromise' runtime/main.js
          ! grep -q 'CinematicSelectorV51' runtime/mainCoreV53.js
          grep -q "import('three-nebula')" runtime/particles/ThreeNebulaParticleFXV53.js
          grep -q "mode:'event-driven'" runtime/particles/ThreeNebulaParticleFXV53.js
          grep -q 'CachedVolumetricNebulaPass' runtime/scene/InterstellarWarpSceneV53.js
          grep -q '230000' runtime/warp/CachedVolumetricNebulaPassV53.js
          ! grep -q 'typpo.github.io/spacekit/build/spacekit.js' index.html
      - name: Scientific LAB audit
        run: |
          grep -q 'CelestiaCore::initSimulation' scientific/celestia/simulation_probe.cpp
          grep -q 'WCSAxes' science/build_astronomy_assets.py
          grep -q 'SpectralCube' science/build_astronomy_assets.py
          grep -q 'astroquery.eso' science/augment_astronomy_assets.py
          grep -q 'nativeBuildVerified' runtime/astronomy/ScientificAstronomyRuntimeLab.js
      - name: Security audit
        run: |
          grep -q '/v1/encounters' runtime/journey/URUXBackendClient.js
          grep -q 'OPENROUTER_API_KEY' worker/src/index-v2.js
          ! grep -R -E 'Authorization\s*:\s*.*Bearer|openrouter\.ai/api/v1/chat/completions' runtime
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node --check runtime/audio/MusicPulseDirectorV66.js
      - run: node --check runtime/journey/PhysicalEncounterRuntimeV66.js
      - run: node --check runtime/warp/CloudNebulaVolumeV66.js
      - run: node --check runtime/warp/VolumetricNebulaRaymarcherV66.js
      - run: node --check runtime/mainCoreV53.js
      - run: node --check worker/src/index-v2.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/nebula-comet-v55.spec.ts
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warp-visual-checkpoints-v66-2
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
