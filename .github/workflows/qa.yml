name: Interstellar Warp QA v61
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Production cinematic-space audit
        run: |
          for f in index.html version.json runtime/main.js runtime/mainCoreV53.js runtime/scene/InterstellarWarpSceneV53.js runtime/warp/WarpFieldManagerV53.js runtime/warp/CloudNebulaVolumeV59.js runtime/warp/CachedVolumetricNebulaPassV53.js runtime/warp/VolumetricNebulaRaymarcherV53.js runtime/warp/DeepSpaceSectorSystemV53.js runtime/warp/GalacticWispSystemV53.js runtime/performance/LayerBudgetSchedulerV53.js runtime/audio/AudioEngineV53.js runtime/journey/CinematicEncounterSystemV59Route.js runtime/journey/CinematicEncounterSystemV59.js runtime/journey/CinematicEncounterSystemV55.js runtime/journey/CinematicEncounterSystemV53.js runtime/particles/ThreeNebulaParticleFXV53.js runtime/journey/SecureURUXJourneyAgent.js runtime/journey/URUXBackendClient.js worker/src/index-v2.js; do test -f "$f"; done
          grep -q 'TRUE-GAS-CROSSING-GUARANTEED-COMET' version.json
          grep -q 'id="enterBtn" disabled' index.html
          grep -q 'interactionReady' index.html
          grep -q '#controls\[hidden\]' index.html
          grep -q 'CloudNebulaVolumeV59' runtime/warp/WarpFieldManagerV53.js
          grep -q '20260814-61' runtime/warp/WarpFieldManagerV53.js
          grep -q "mode:'continuous-volumetric-traversal'" runtime/warp/CloudNebulaVolumeV59.js
          grep -q "volumeType:'3d-point-gas-v59'" runtime/warp/CloudNebulaVolumeV59.js
          grep -q 'cameraCrossings' runtime/warp/CloudNebulaVolumeV59.js
          grep -q 'coloredGas:true' runtime/warp/CloudNebulaVolumeV59.js
          grep -q 'emissiveVolumes' runtime/warp/CloudNebulaVolumeV59.js
          grep -q 'rectangularBillboards:false' runtime/warp/CloudNebulaVolumeV59.js
          grep -q 'new THREE.Points' runtime/warp/CloudNebulaVolumeV59.js
          grep -q 'new THREE.ShaderMaterial' runtime/warp/CloudNebulaVolumeV59.js
          test "$(grep -o 'precision mediump float;' runtime/warp/CloudNebulaVolumeV59.js | wc -l)" -ge 2
          ! grep -q 'THREE.Sprite' runtime/warp/CloudNebulaVolumeV59.js
          ! grep -q 'SpriteMaterial' runtime/warp/CloudNebulaVolumeV59.js
          grep -q 'CinematicEncounterSystemV59Route' runtime/journey/CinematicSelectorV51.js
          grep -q 'scheduleGuaranteedComet' runtime/journey/CinematicEncounterSystemV59Route.js
          grep -q 'timerGuaranteed=true' runtime/journey/CinematicEncounterSystemV59Route.js
          grep -q 'PLANET_VARIANTS' runtime/journey/CinematicEncounterSystemV59.js
          grep -q 'buildTailGeometry' runtime/journey/CinematicEncounterSystemV59.js
          grep -q 'guaranteedProcedural:true' runtime/journey/CinematicEncounterSystemV59.js
          grep -q 'longIonTail:true' runtime/journey/CinematicEncounterSystemV59.js
          grep -q 'longDustTail:true' runtime/journey/CinematicEncounterSystemV59.js
          grep -q 'morfología bilobulada tipo 67P' runtime/journey/CinematicEncounterSystemV55.js
          grep -q 'redThermalShell:false' runtime/journey/CinematicEncounterSystemV55.js
          ! grep -q '0xff6a18' runtime/journey/CinematicEncounterSystemV55.js
          grep -q "import('three-nebula')" runtime/particles/ThreeNebulaParticleFXV53.js
          grep -q "mode:'event-driven'" runtime/particles/ThreeNebulaParticleFXV53.js
          grep -q 'CachedVolumetricNebulaPass' runtime/scene/InterstellarWarpSceneV53.js
          grep -q '230000' runtime/warp/CachedVolumetricNebulaPassV53.js
          ! grep -q 'typpo.github.io/spacekit/build/spacekit.js' index.html
      - name: Scientific LAB audit
        run: |
          grep -q 'CelestiaCore::initSimulation' scientific/celestia/simulation_probe.cpp
          grep -q 'WCSAxes' science/build_astronomy_assets.py
          grep -q 'SpectralCube' science/build_astronomy_assets.py
          grep -q 'astroquery.eso' science/augment_astronomy_assets.py
          grep -q 'nativeBuildVerified' runtime/astronomy/ScientificAstronomyRuntimeLab.js
      - name: Security audit
        run: |
          grep -q '/v1/encounters' runtime/journey/URUXBackendClient.js
          grep -q 'OPENROUTER_API_KEY' worker/src/index-v2.js
          ! grep -R -E 'Authorization\s*:\s*.*Bearer|openrouter\.ai/api/v1/chat/completions' runtime
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node --check worker/src/index-v2.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/nebula-comet-v55.spec.ts
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warp-visual-checkpoints-v61
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
