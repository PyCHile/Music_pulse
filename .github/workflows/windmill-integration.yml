name: URUX Windmill Integration

on:
  workflow_dispatch:
  push:
    paths:
      - "windmill/**"
      - "worker/src/windmill.js"
      - ".github/workflows/windmill-integration.yml"

jobs:
  windmill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official Windmill self-host compose
        run: |
          mkdir -p .windmill-ci
          curl -fsSL https://raw.githubusercontent.com/windmill-labs/windmill/main/docker-compose.yml -o .windmill-ci/docker-compose.yml
          curl -fsSL https://raw.githubusercontent.com/windmill-labs/windmill/main/Caddyfile -o .windmill-ci/Caddyfile
          curl -fsSL https://raw.githubusercontent.com/windmill-labs/windmill/main/.env -o .windmill-ci/.env

      - name: Start literal Windmill Community Edition
        working-directory: .windmill-ci
        run: docker compose up -d

      - name: Verify Windmill API health
        run: |
          python - <<'PY'
          import time,urllib.request
          last=None
          for _ in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1/api/health/status',timeout=3) as r:
                      body=r.read().decode()
                  print(body)
                  break
              except Exception as exc:
                  last=exc;time.sleep(2)
          else: raise SystemExit(f'Windmill did not become healthy: {last}')
          PY

      - name: Install official Windmill CLI
        run: |
          npm install -g windmill-cli
          wmill --version

      - name: Authenticate to ephemeral Windmill
        id: auth
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, urllib.request
          req=urllib.request.Request(
              'http://127.0.0.1/api/users/login',
              data=json.dumps({'email':'admin@windmill.dev','password':'changeme'}).encode(),
              headers={'Content-Type':'application/json','Accept':'application/json'},
              method='POST')
          with urllib.request.urlopen(req,timeout=10) as r:
              raw=r.read().decode().strip()
          try: token=json.loads(raw)
          except Exception: token=raw
          if isinstance(token,dict): token=token.get('token') or token.get('access_token')
          if not isinstance(token,str) or len(token)<20: raise SystemExit('Windmill login did not return a usable token')
          print('token='+token)
          PY

      - name: Generate metadata and push URUX scripts into Windmill
        working-directory: windmill
        env:
          WM_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          wmill generate-metadata f/urux --yes --base-url http://127.0.0.1 --token "$WM_TOKEN" --workspace admins
          wmill sync push --yes --base-url http://127.0.0.1 --token "$WM_TOKEN" --workspace admins
          wmill script show f/urux/validate_encounter --base-url http://127.0.0.1 --token "$WM_TOKEN" --workspace admins >/dev/null
          wmill script show f/urux/direct_journey --base-url http://127.0.0.1 --token "$WM_TOKEN" --workspace admins >/dev/null

      - name: Execute URUX validator inside Windmill
        working-directory: windmill
        env:
          WM_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cat > /tmp/validation-input.json <<'JSON'
          {
            "batch": {
              "encounters": [
                {"id":"wm-1","narrativeStage":"TUNEL","objectType":"comet","spawnDepth":0,"spawnPosition":{"x":0.2,"y":-0.1},"focalApproach":true,"trajectoryVector":{"x":-0.02,"y":0.01,"z":1},"scale":1.1,"speed":0.8,"palette":["#02020a","#0d1b4b","#4b0082"],"luminosity":0.6,"durationSeconds":12},
                {"id":"wm-2","narrativeStage":"TUNEL","objectType":"debris","spawnDepth":0,"spawnPosition":{"x":-0.4,"y":0.2},"focalApproach":false,"trajectoryVector":{"x":0.04,"y":-0.01,"z":1},"scale":0.8,"speed":0.7,"palette":["#02020a","#0d1b4b","#4b0082"],"luminosity":0.4,"durationSeconds":10},
                {"id":"wm-3","narrativeStage":"TUNEL","objectType":"light_filament","spawnDepth":0,"spawnPosition":{"x":0.0,"y":0.3},"focalApproach":true,"trajectoryVector":{"x":0,"y":-0.02,"z":1},"scale":1.3,"speed":0.6,"palette":["#02020a","#0d1b4b","#4b0082"],"luminosity":0.7,"durationSeconds":14}
              ],
              "nebulaUpdate":{"darkZoneFraction":0.55,"filamentDensity":0.62,"luminousCore":{"x":0.1,"y":-0.05},"chromaticRange":["#02020a","#0d1b4b","#4b0082"]}
            },
            "allowedCapabilities":["three","three-nebula","postprocessing","volumetric-raymarch"]
          }
          JSON
          RESULT=$(wmill script run f/urux/validate_encounter -d @/tmp/validation-input.json -s --base-url http://127.0.0.1 --token "$WM_TOKEN" --workspace admins)
          echo "$RESULT"
          RESULT="$RESULT" python - <<'PY'
          import json,os
          d=json.loads(os.environ['RESULT'])
          assert d['ok'] is True, d
          assert d['policy'].startswith('Windmill validates/orchestrates')
          assert 'volumetric-raymarch' in d['allowedCapabilities']
          print('Windmill validator executed successfully')
          PY

      - name: Execute URUX journey director inside Windmill
        working-directory: windmill
        env:
          WM_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cat > /tmp/director-input.json <<'JSON'
          {"input":{"stage":"TUNEL","capabilities":{"three":{"id":"three","available":true,"kind":"renderer"},"three-nebula":{"id":"three-nebula","available":true,"kind":"particles"},"volumetric-raymarch":{"id":"volumetric-raymarch","available":true,"kind":"shader"},"imaginary-effect":{"id":"imaginary-effect","available":false}},"recentActions":["comet trajectory aligned"],"bufferDepth":2}}
          JSON
          RESULT=$(wmill script run f/urux/direct_journey -d @/tmp/director-input.json -s --base-url http://127.0.0.1 --token "$WM_TOKEN" --workspace admins)
          echo "$RESULT"
          RESULT="$RESULT" python - <<'PY'
          import json,os
          d=json.loads(os.environ['RESULT'])
          assert d['ok'] is True
          assert d['directives']['onlyUseDeclaredCapabilities'] is True
          assert d['directives']['noRenderLoopCalls'] is True
          assert 'three-nebula' in d['availableCapabilities']
          assert 'imaginary-effect' not in d['availableCapabilities']
          print('Windmill journey orchestration executed successfully')
          PY

      - name: Verify Windmill remains outside render loop
        run: |
          grep -q "noRenderLoopCalls:true" windmill/f/urux/direct_journey.ts
          grep -q "never runs in Three.js render loop" windmill/f/urux/validate_encounter.ts
          if grep -R -E "requestAnimationFrame|renderer\.render|composer\.render" windmill/f/urux; then
            echo "Windmill render-loop coupling detected"; exit 1
          fi

      - name: Stop ephemeral Windmill
        if: always()
        working-directory: .windmill-ci
        run: docker compose down -v
