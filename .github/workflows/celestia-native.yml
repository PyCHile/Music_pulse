name: URUX Celestia Native

on:
  push:
    paths:
      - "native/celestia/**"
      - "native/celestia-sidecar/**"
      - "science/index_celestia_content.py"
      - "science/export_celestia_static_runtime.py"
      - ".github/workflows/celestia-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-celestia:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout URUX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout literal Celestia source
        uses: actions/checkout@v4
        with:
          repository: CelestiaProject/Celestia
          ref: 84153ded046fbea46c9f411dd0232e5426373ead
          path: external/Celestia
          fetch-depth: 1

      - name: Checkout official CelestiaContent
        uses: actions/checkout@v4
        with:
          repository: CelestiaProject/CelestiaContent
          ref: e4d5d2754b6224f04e440e53b189f9ee96b6d1fe
          path: external/CelestiaContent
          fetch-depth: 1

      - name: Install native Celestia build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libepoxy-dev libeigen3-dev libfmt-dev libpng-dev libjpeg-dev \
            libfreetype6-dev gperf libboost-dev liblua5.4-dev gettext

      - name: Build complete Celestia shared library and precompute static runtime
        env:
          CELESTIA_SOURCE_REF: 84153ded046fbea46c9f411dd0232e5426373ead
          CELESTIA_CONTENT_REF: e4d5d2754b6224f04e440e53b189f9ee96b6d1fe
          CELESTIA_BUILD_JOBS: "2"
          URUX_SIDECAR_TOKEN: "github-actions-only-urux-celestia-token-20260813"
        run: bash native/celestia/build.sh

      - name: Verify native Celestia and static runtime export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=Path('runtime/assets/astronomy/celestia-native-manifest.json')
          runtime=Path('runtime/assets/astronomy/celestia-static-runtime.json')
          content=Path('runtime/assets/astronomy/celestia-content-index.json')
          assert manifest.exists() and runtime.exists() and content.exists()
          m=json.loads(manifest.read_text())
          r=json.loads(runtime.read_text())
          c=json.loads(content.read_text())
          assert m['nativeBuildVerified'] is True
          assert m['sidecarBinaryVerified'] is True
          assert m['ephemeralSidecarExecuted'] is True
          assert m['staticRuntimeActive'] is True
          assert m['integrationMode'] == 'github-actions-static-precompute'
          for module in ('celengine','celephem','celrender','celscript','celx'):
              assert module in m['compiledSubsystems']
          assert r['native'] is True
          assert r['photometryLut'] and r['equatorialLut'] and r['anomalyLut'] and r['obliquityLut']
          assert c['resourceFamilies']['solarSystem'] > 0
          assert c['resourceFamilies']['stars'] > 0
          assert c['resourceFamilies']['deepSky'] > 0
          assert Path('build/urux-celestia-sidecar').exists()
          print(json.dumps({'manifest':m,'usage':r['usage'],'resources':c['resourceFamilies']}, indent=2))
          PY

      - name: Upload literal Celestia native build
        uses: actions/upload-artifact@v4
        with:
          name: urux-celestia-native
          path: |
            build/celestia/src/celestia/libcelestia.so*
            build/urux-celestia-sidecar
            runtime/assets/astronomy/celestia-native-manifest.json
            runtime/assets/astronomy/celestia-content-index.json
            runtime/assets/astronomy/celestia-static-runtime.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit static Celestia products for GitHub Pages
        run: |
          git config user.name "urux-celestia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/assets/astronomy/celestia-native-manifest.json \
                  runtime/assets/astronomy/celestia-content-index.json \
                  runtime/assets/astronomy/celestia-static-runtime.json
          if git diff --cached --quiet; then
            echo "No Celestia static asset changes"
          else
            git commit -m "data: refresh literal Celestia static runtime"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
