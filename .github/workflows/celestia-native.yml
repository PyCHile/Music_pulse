name: URUX Celestia Native

on:
  push:
    paths:
      - "native/celestia/**"
      - "native/celestia-sidecar/**"
      - "science/index_celestia_content.py"
      - "wrangler.jsonc"
      - "worker/src/entry.js"
      - ".github/workflows/celestia-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-celestia:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout URUX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout literal Celestia source
        uses: actions/checkout@v4
        with:
          repository: CelestiaProject/Celestia
          ref: 84153ded046fbea46c9f411dd0232e5426373ead
          path: external/Celestia
          fetch-depth: 1

      - name: Checkout official CelestiaContent
        uses: actions/checkout@v4
        with:
          repository: CelestiaProject/CelestiaContent
          ref: e4d5d2754b6224f04e440e53b189f9ee96b6d1fe
          path: external/CelestiaContent
          fetch-depth: 1

      - name: Install native Celestia build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libepoxy-dev libeigen3-dev libfmt-dev libpng-dev libjpeg-dev \
            libfreetype6-dev gperf libboost-dev liblua5.4-dev gettext

      - name: Build complete Celestia shared library, tools and sidecar
        env:
          CELESTIA_SOURCE_REF: 84153ded046fbea46c9f411dd0232e5426373ead
          CELESTIA_CONTENT_REF: e4d5d2754b6224f04e440e53b189f9ee96b6d1fe
          CELESTIA_BUILD_JOBS: "2"
        run: bash native/celestia/build.sh

      - name: Verify native manifest and executed sidecar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/assets/astronomy/celestia-native-manifest.json')
          d=json.loads(p.read_text())
          assert d['nativeBuildVerified'] is True
          assert d['sidecarBinaryVerified'] is True
          assert d['runtimeActive'] is False
          assert 'celengine' in d['compiledSubsystems']
          assert 'celephem' in d['compiledSubsystems']
          assert 'celrender' in d['compiledSubsystems']
          assert '/ready' in d['verifiedEndpoints']
          assert Path('build/urux-celestia-sidecar').exists()
          print(json.dumps(d, indent=2))
          PY

      - name: Upload literal Celestia native build
        uses: actions/upload-artifact@v4
        with:
          name: urux-celestia-native
          path: |
            build/celestia/src/celestia/libcelestia.so*
            build/urux-celestia-sidecar
            runtime/assets/astronomy/celestia-native-manifest.json
            runtime/assets/astronomy/celestia-content-index.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified Celestia metadata
        run: |
          git config user.name "urux-celestia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/assets/astronomy/celestia-native-manifest.json runtime/assets/astronomy/celestia-content-index.json
          if git diff --cached --quiet; then
            echo "No Celestia metadata changes"
          else
            git commit -m "build: verify literal Celestia engine and sidecar"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
