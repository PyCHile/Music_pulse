name: URUX Planetary PBR Assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/planetary-assets.yml"
      - "runtime/assets/AstronomicalTextureManager.js"

permissions:
  contents: write

jobs:
  planetary-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout URUX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake git curl

      - name: Build Basis Universal literal encoder
        run: |
          git clone --depth 1 https://github.com/BinomialLLC/basis_universal.git external/basis_universal
          cmake -S external/basis_universal -B build/basisu -DCMAKE_BUILD_TYPE=Release
          cmake --build build/basisu --parallel 2
          test -x build/basisu/bin/basisu

      - name: Fetch documented Three.js r185 Earth PBR sources
        run: |
          mkdir -p runtime/assets/planets/earth/source runtime/assets/planets/earth/ktx2
          BASE=https://raw.githubusercontent.com/mrdoob/three.js/r185/examples/textures/planets
          for f in earth_day_4096.jpg earth_night_4096.jpg earth_bump_roughness_clouds_4096.jpg earth_normal_2048.jpg earth_clouds_1024.png earth_atmos_2048.jpg; do
            curl -fL --retry 3 "$BASE/$f" -o "runtime/assets/planets/earth/source/$f"
          done

      - name: Encode UASTC KTX2 with mipmaps
        run: |
          BASIS=build/basisu/bin/basisu
          OUT="$PWD/runtime/assets/planets/earth/ktx2"
          cd runtime/assets/planets/earth/source
          for f in earth_day_4096.jpg earth_night_4096.jpg earth_bump_roughness_clouds_4096.jpg earth_normal_2048.jpg earth_clouds_1024.png earth_atmos_2048.jpg; do
            "$GITHUB_WORKSPACE/$BASIS" -ktx2 -uastc -mipmap -quality 75 "$f"
            mv "${f%.*}.ktx2" "$OUT/"
          done

      - name: Validate KTX2 and write manifest
        run: |
          BASIS=build/basisu/bin/basisu
          for f in runtime/assets/planets/earth/ktx2/*.ktx2; do "$BASIS" -validate "$f"; done
          python - <<'PY'
          import json, hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('runtime/assets/planets/earth')
          files={}
          for p in sorted(root.rglob('*')):
              if p.is_file(): files[p.relative_to(root).as_posix()]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          payload={
            'schema':'urux-earth-pbr-v1','generatedAt':datetime.now(timezone.utc).isoformat(),
            'source':'Three.js r185 Earth example; upstream page credits Solar System Scope (resized/merged)',
            'basisUniversal':True,'ktx2':True,'codec':'UASTC LDR','mipmaps':True,
            'channels':{
              'albedo':'earth_day_4096','nightLights':'earth_night_4096','normal':'earth_normal_2048',
              'packedBumpRoughnessClouds':{'file':'earth_bump_roughness_clouds_4096','R':'height/bump','G':'roughness','B':'cloud strength'},
              'clouds':'earth_clouds_1024','atmosphereReference':'earth_atmos_2048',
              'atmosphereRuntime':'Fresnel + light-direction procedural shell (existing URUX function)'
            },'files':files}
          (root/'manifest.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY

      - name: Commit generated PBR/KTX2 assets
        run: |
          git config user.name "urux-assets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/assets/planets/earth
          if git diff --cached --quiet; then
            echo "No planetary asset changes"
          else
            git commit -m "data: refresh Earth PBR KTX2 assets"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
