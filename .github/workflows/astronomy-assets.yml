name: URUX Astronomy Assets

on:
  push:
    paths:
      - "science/**"
      - "requirements-astro.txt"
      - "scientific/requirements-astronomy.txt"
      - ".github/workflows/astronomy-assets.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Astronomical target resolved by SIMBAD
        required: false
        default: "M 42"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  astronomy-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      URUX_ASTRONOMY_TARGET: ${{ github.event.inputs.target || 'M 42' }}
      URUX_ASTRONOMY_PIXELS: "256"
      URUX_ASTRONOMY_RADIUS_DEG: "0.25"
      URUX_ENABLE_SPECTRAL_CUBE: "1"
    steps:
      - name: Checkout URUX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-astro.txt

      - name: Install astronomy stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-astro.txt

      - name: Compile scientific scripts
        run: python -m compileall science scientific

      - name: Execute Astropy/Astroquery/APLpy/Reproject/SpectralCube pipeline
        run: python science/build_astronomy_assets.py

      - name: Add ESO archive and NIST visible spectrum products
        run: python science/augment_astronomy_assets.py

      - name: Verify generated scientific manifest
        run: |
          test -f runtime/assets/astronomy/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/assets/astronomy/manifest.json')
          d=json.loads(p.read_text())
          caps=d.get('capabilities',{})
          required=[
            'astroquery.simbad','astroquery.jplhorizons','astroquery.gaia','astroquery.skyview',
            'astropy.visualization','astropy.wcsaxes','reproject.interp','reproject.adaptive',
            'reproject.exact','aplpy','spectral-cube'
          ]
          missing=[k for k in required if not caps.get(k)]
          if missing: raise SystemExit('required astronomy capabilities failed: '+', '.join(missing))
          # ESO/NIST are public remote services and can transiently fail; their
          # failure is recorded in the manifest instead of fabricating data.
          print(json.dumps({'requiredOK':True,'eso':caps.get('astroquery.eso'),'nist':caps.get('astroquery.nist'),'errors':d.get('errors',{})},indent=2))
          PY

      - name: Commit compact scientific outputs
        run: |
          git config user.name "urux-astronomy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/assets/astronomy
          if git diff --cached --quiet; then
            echo "No astronomy asset changes"
          else
            git commit -m "data: refresh URUX astronomy assets"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
